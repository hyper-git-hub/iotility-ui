<header>
  <div class="brand"><ng-content select="[header-brand]" /></div>
  <div class="actions">
    <ng-content select="[header-actions]" />
    @if (showLive()) {
      <span class="live" [class.offline]="liveOffline()" [attr.title]="liveOffline() ? 'All vehicles offline' : 'Realtime tracking active'">
        <i [class.offline-dot]="liveOffline()"></i>Live
      </span>
    }
    <button class="theme" type="button" (click)="toggleTheme()" [tooltip]="isDark ? 'Switch to light theme' : 'Switch to dark theme'">
      @if (isDark) {
        <img src="assets/fleetpoint/icons/sun-brand.svg" alt="" aria-hidden="true"/>
        Light
      } @else {
        <img src="assets/fleetpoint/icons/moon-muted.svg" alt="" aria-hidden="true"/>
        Dark
      }
    </button>
    <shared-dropdown [options]="profileOptions" mode="action" (optionSelected)="selectProfileOption($event)">
      <button dropdown-trigger type="button" class="profile-button">
        <span class="profile-copy"><small>Signed in as</small><strong>{{ userName() }}</strong></span>
        <span class="profile-avatar">{{ userInitials() }}</span>
      </button>
    </shared-dropdown>
  </div>
</header>
