<header>
  <div class="brand"><ng-content select="[header-brand]" /></div>
  <div class="actions">
    <ng-content select="[header-actions]" />
    @if (showLive()) {
      <shared-status-badge
        variant="header"
        [online]="!liveOffline()"
        onlineLabel="Live"
        offlineLabel="Live"
        [onlineTitle]="'Realtime tracking active'"
        [offlineTitle]="'All vehicles offline'"
        [attr.aria-label]="liveOffline() ? 'All vehicles offline' : 'Realtime tracking active'"
      />
    }
    <shared-user-menu
      [userName]="userName()"
      [userInitials]="userInitials()"
      [userRole]="userRole()"
      (profileAction)="profileAction.emit($event)"
    />
  </div>
</header>
