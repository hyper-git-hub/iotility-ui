<header>
  <div class="brand"><ng-content select="[header-brand]" /></div>
  <div class="actions">
    @if (showLive()) {
      <span class="live"><i></i>Live</span>
    }
    <button class="theme" type="button" (click)="toggleTheme()">
      @if (isDark) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        Light
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" /></svg>
        Dark
      }
    </button>
    <shared-dropdown [options]="profileOptions" mode="action" (optionSelected)="selectProfileOption($event)">
      <button dropdown-trigger type="button" class="profile-button">
        <span class="profile-copy"><small>Signed in as</small><strong>{{ userName() }}</strong></span>
        <span class="profile-avatar">{{ userInitials() }}<i></i></span>
      </button>
    </shared-dropdown>
  </div>
</header>
