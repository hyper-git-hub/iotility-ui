@if (totalPages() > 1) {
  <nav class="table-pagination" aria-label="Table pages">
    <span class="pagination-range">Showing {{ rangeStart() }}–{{ rangeEnd() }} of {{ totalItems() }}</span>
    <div class="pagination-controls">
      <button type="button" class="page-step" [disabled]="loading() || normalizedPage() <= 1"
        [attr.aria-label]="'Previous page'" (click)="goTo(normalizedPage() - 1)">
        Prev
      </button>
      <div class="page-numbers">
        @for (item of pageItems(); track item.key) {
          @if (item.page === null) {
            <span class="page-ellipsis" aria-hidden="true">…</span>
          } @else {
            <button
              type="button"
              class="page-number"
              [class.active]="item.page === normalizedPage()"
              [attr.aria-current]="item.page === normalizedPage() ? 'page' : null"
              [attr.aria-label]="'Page ' + item.page"
              [disabled]="loading()"
              (click)="goTo(item.page)"
            >{{ pageLabel(item.page) }}</button>
          }
        }
      </div>
      <button type="button" class="page-step" [disabled]="loading() || normalizedPage() >= totalPages()"
        [attr.aria-label]="'Next page'" (click)="goTo(normalizedPage() + 1)">
        Next
      </button>
    </div>
  </nav>
}
