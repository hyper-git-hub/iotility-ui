<article class="stat-card-skeleton" [class.compact]="compact()" aria-hidden="true">
  @if (showIcon()) {
    <ui-skeleton
      class="stat-card-skeleton-icon"
      [width]="compact() ? '2rem' : '2.25rem'"
      [height]="compact() ? '2rem' : '2.25rem'"
      radius="0.75rem"
    />
  }
  <ui-skeleton
    class="stat-card-skeleton-value"
    [width]="valueWidth()"
    height="1.75rem"
    radius="0.35rem"
  />
  <ui-skeleton
    class="stat-card-skeleton-label"
    [width]="labelWidth()"
    height="1rem"
    radius="0.3rem"
  />
</article>
