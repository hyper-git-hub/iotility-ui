<svg width="491" height="125" viewBox="0 46 491 125" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style><![CDATA[
        /* 1. Wave & Z-Axis Expansion for Connected Dots */
        @keyframes waveExpand {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.4);
                opacity: 0.6;
                filter: blur(1px);
            }
        }

        /* 2. Floating Wave Animation for the whole arch */
        @keyframes floatWave {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* 3. Smooth Radar Pulse for separate dots */
        @keyframes radarPing {
            0% {
                transform: scale(1);
                opacity: 0.6;
                stroke-width: 2;
            }

            100% {
                transform: scale(2.2);
                opacity: 0;
                stroke-width: 0.5;
            }
        }

        /* 4. Gentle breathing for the wordmark text */
        @keyframes brandPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .arch-group {
            animation: floatWave 4s ease-in-out infinite;
            transform-origin: center;
        }

        .node-overlay {
            transform-origin: center;
            animation: waveExpand 3s ease-in-out infinite;
        }

        .node-1 {
            animation-delay: 0s;
            transform-origin: 15px 100px;
        }

        .node-2 {
            animation-delay: 0.6s;
            transform-origin: 51px 62px;
        }

        .node-3 {
            animation-delay: 1.2s;
            transform-origin: 87px 25px;
        }

        .node-4 {
            animation-delay: 1.8s;
            transform-origin: 124px 62px;
        }

        .ping {
            animation: radarPing 3s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .ping-1 {
            transform-origin: 87.5px 94px;
        }

        .ping-2 {
            transform-origin: 160px 100px;
            animation-delay: 1.5s;
        }

        .brand-text {
            animation: brandPulse 3s ease-in-out infinite;
        }
    ]]></style>

    <defs>
        <linearGradient id="loader-gradient" x1="3.27249" y1="50.3952" x2="138.661" y2="85.9596" gradientUnits="userSpaceOnUse">
            <stop offset="0.12" stop-color="#525DF7" />
            <stop offset="0.77" stop-color="#34DBE8" />
        </linearGradient>
        <clipPath id="text-clip">
            <rect width="431" height="125" fill="white" />
        </clipPath>
    </defs>

