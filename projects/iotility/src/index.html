<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Iotility</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <style>
      .bootstrap-loading {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100vh;
        overflow: hidden;
        padding: 0 1.5rem;
        box-sizing: border-box;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background-color: #f4f7fb;
      }

      /* Two brand ambiences (cyan + violet) over a black / light base. */
      .bootstrap-loading::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 8% 6%, rgb(0 194 255 / 28%) 0%, transparent 44%),
          radial-gradient(circle at 96% 96%, rgb(138 63 252 / 22%) 0%, transparent 48%),
          linear-gradient(145deg, #ffffff, #eaf3fb);
      }

      html.dark .bootstrap-loading {
        color: #fff;
        background-color: #070b14;
      }

      html.dark .bootstrap-loading::before {
        background:
          radial-gradient(circle at 8% 6%, rgb(0 194 255 / 26%) 0%, transparent 46%),
          radial-gradient(circle at 96% 96%, rgb(138 63 252 / 36%) 0%, transparent 48%),
          linear-gradient(145deg, #05070d, #140c24);
      }

      .bootstrap-loading__content {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 32rem;
        margin: auto;
        text-align: center;
      }

      .bootstrap-loading__logos {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        margin: 0 auto 2rem;
      }
      
      .bootstrap-loading__product-logo {
        display: block;
        width: auto;
        max-width: 15rem;
        height: 2.5rem;
        flex-shrink: 0;
      }
      
      .bootstrap-loading__label-logo {
        display: block;
        width: auto;
        max-width: 15rem;
        height: 2.5rem;
        flex-shrink: 0;
      }

      .bootstrap-loading__separator {
        width: 1px;
        height: 2.5rem;
        flex-shrink: 0;
        background: rgb(255 255 255 / 25%);
      }

      /* Light theme: logos keep their original brand colours, so the row keeps a
         dark translucent chip behind them (they are white artwork). */
      html:not(.dark) .bootstrap-loading__logos {
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        background: rgb(7 11 20 / 88%);
      }

      .bootstrap-loading__title {
        margin: 0.75rem 0 0;
        font-size: 1.875rem;
        font-weight: 700;
        line-height: 2.25rem;
        letter-spacing: -0.025em;
      }

      .bootstrap-loading__message {
        margin: 0.5rem 0 0;
        color: #117dac;
        font-size: 0.875rem;
        line-height: 1.25rem;
      }

      .bootstrap-loading__track {
        margin-top: 2rem;
        padding: 0.1875rem;
        overflow: hidden;
        border-radius: 9999px;
        background: rgb(15 23 42 / 8%);
      }

      .bootstrap-loading__bar {
        position: relative;
        width: 55%;
        height: 0.25rem;
        border-radius: 9999px;
        background: linear-gradient(90deg, #22d3ee, #0ea5e9, #a855f7);
        animation: bootstrap-loading-progress 2.2s ease-in-out infinite;
      }

      .bootstrap-loading__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 50%;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 45%), transparent);
        animation: bootstrap-loading-shimmer 1.6s ease-in-out infinite;
      }

      html.dark .bootstrap-loading__message {
        color: #d8b4fe;
      }

      html.dark .bootstrap-loading__track {
        background: rgb(255 255 255 / 10%);
      }

      @keyframes bootstrap-loading-progress {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(405%); }
      }

      @keyframes bootstrap-loading-shimmer {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(240%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .bootstrap-loading__bar { animation-timing-function: linear; }
      }
    </style>
  </head>
  <body>
    <main id="bootstrap-loading" class="bootstrap-loading">
      <section
        class="bootstrap-loading__content"
        aria-live="polite"
        aria-busy="true"
      >
        <div class="bootstrap-loading__logos">
          <img
            src="assets/iotility-loader-light.svg"
            alt="IoTility"
            class="bootstrap-loading__product-logo"
          />
          <div class="bootstrap-loading__separator" aria-hidden="true"></div>
          <img
            src="assets/hypernym-loader-full.svg"
            alt="Hypernym"
            class="bootstrap-loading__label-logo"
          />
        </div>
        <h1 class="bootstrap-loading__title">Loading IoTility</h1>
        <p class="bootstrap-loading__message">
          Preparing your connected operations platform&hellip;
        </p>
        <div class="bootstrap-loading__track" aria-hidden="true">
          <div class="bootstrap-loading__bar"></div>
        </div>
        </section>
      </main>
      <app-root></app-root>
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const saved = localStorage.getItem('iotility-theme');
          const html = document.documentElement;
          if (saved === 'dark') {
            html.classList.add('dark');
          } else if (saved === 'light') {
            html.classList.remove('dark');
          } else {
            html.classList.add('dark');
          }
        });
      </script>
    </body>
  </html>
