<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Iotility</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <style>
      .bootstrap-loading {
        position: fixed;
        inset: 0;
        display: grid;
        min-height: 100vh;
        overflow: hidden;
        padding: 0 1.5rem;
        box-sizing: border-box;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background:
          radial-gradient(circle at 50% 45%, rgb(113 51 220 / 34%) 0%, transparent 36%),
          linear-gradient(145deg, #09090f, #19082f);
      }

      .bootstrap-loading__content {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 28rem;
        margin: auto;
        text-align: center;
      }

.bootstrap-loading__logos {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
      }

      .bootstrap-loading__product-logo,
      .bootstrap-loading__label-logo {
        display: block;
        width: auto;
        max-width: 8rem;
        height: 2.5rem;
      }

      .bootstrap-loading__separator {
        width: 1px;
        height: 2.5rem;
        margin: 0 1.25rem;
        background: rgb(255 255 255 / 25%);
      }

      .bootstrap-loading__title {
        margin: 0.75rem 0 0;
        font-size: 1.875rem;
        font-weight: 700;
        line-height: 2.25rem;
        letter-spacing: 0.03em
      }

      .bootstrap-loading__message {
        margin: 0.5rem 0 0;
        color: #cbb5ff;
        font-size: 0.875rem;
        line-height: 1.25rem;
      }

      .bootstrap-loading__track {
        margin-top: 2rem;
        padding: 0.1875rem;
        overflow: hidden;
        border-radius: 9999px;
        background: rgb(255 255 255 / 10%);
      }

      .bootstrap-loading__bar {
        width: 55%;
        height: 0.25rem;
        border-radius: 9999px;
        background: linear-gradient(90deg, #a678ff, #8347f5, #3978d4);
        animation: bootstrap-loading-progress 2.2s ease-in-out infinite;
      }

      @keyframes bootstrap-loading-progress {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(405%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .bootstrap-loading__bar { animation-timing-function: linear; }
      }
    </style>
  </head>
  <body>
    <main id="bootstrap-loading" class="bootstrap-loading">
      <section
        class="bootstrap-loading__content"
        aria-live="polite"
        aria-busy="true"
      >
<div class="bootstrap-loading__logos">
          <img
            src="assets/iotility-light.svg"
            alt="IoTility"
            class="bootstrap-loading__product-logo"
          />
          <div class="bootstrap-loading__separator" aria-hidden="true"></div>
          <img
            src="assets/hypernym-full.svg"
            alt="Hypernym"
            class="bootstrap-loading__label-logo"
          />
        </div>
        <h1 class="bootstrap-loading__title">Loading IoTility</h1>

        <p class="bootstrap-loading__message">
          Preparing your connected operations platform&hellip;
        </p>
        <div class="bootstrap-loading__track" aria-hidden="true">
          <div class="bootstrap-loading__bar"></div>
        </div>
      </section>
    </main>
    <app-root></app-root>
  </body>
</html>
