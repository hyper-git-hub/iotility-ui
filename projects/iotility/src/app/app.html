@if (navigationProgress() !== 'idle') {
  <div
    class="route-progress"
    [class.complete]="navigationProgress() === 'complete'"
    role="progressbar"
    aria-label="Loading page"
    aria-valuetext="Loading"
  >
    <span></span>
  </div>
}

<router-outlet />
<app-feedback-dialog />
<ui-blocking-loader [visible]="authLogout.loggingOut()" label="Signing you out" message="Securely closing your IoTility session..." />

@if (loading.isVisible()) {
  <div class="fixed inset-0 z-[3000]">
    <app-loading
      [label]="loading.config().label"
      [title]="loading.config().title"
      [message]="loading.config().message"
      [initials]="loading.config().initials"
      [logoSrc]="loading.config().logoSrc ?? null"
      [labelLogoSrc]="loading.config().labelLogoSrc ?? null"
    />
  </div>
}
