<div class="layout-shell">
  @if (sidebarOpen()) {
    <button
      type="button"
      class="mobile-sidebar-backdrop"
      aria-label="Close navigation"
      (click)="closeSidebar()"
    ></button>
  }
  <div class="sidebar-region" [class.open]="sidebarOpen()" (click)="closeSidebar()">
    <app-sidebar />
  </div>
  <div class="flex min-w-0 flex-1 flex-col">
    <app-header (menuToggle)="openSidebar()" />
    <main class="min-h-0 flex-1 overflow-y-auto dark:bg-dark-surface">
      <router-outlet />
    </main>
  </div>
</div>
