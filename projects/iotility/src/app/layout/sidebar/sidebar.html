<aside class="sidebar-shell">
  <a
    routerLink="/home"
    class="grid size-12 shrink-0 place-items-center"
    aria-label="Hypernym — IoTility home"
  >
    <img src="assets/hypernym.svg" alt="Hypernym" class="sidebar-logo-dark h-9 w-auto" />
    <img src="assets/hypernym-black.svg" alt="Hypernym" class="sidebar-logo-light h-9 w-auto" />
  </a>

  <nav class="flex flex-1 flex-col items-center gap-1" aria-label="Primary navigation">
    <div class="relative">
      <button
        type="button"
        class="sidebar-nav-item"
        [class.sidebar-nav-active]="useCasesOpen()"
        (click)="toggleUseCases()"
        [attr.aria-expanded]="useCasesOpen()"
      >
        <span class="color-icon" style="--icon: url('/assets/icons/grid.svg')" aria-hidden="true"></span>
        <span>Use Cases</span>
      </button>
      <div class="use-cases-backdrop" [class.use-open]="useCasesOpen()" aria-hidden="true" (click)="closeUseCases()"></div>
        <section
          class="use-cases-window"
          [class.use-open]="useCasesOpen()"
          [attr.aria-hidden]="!useCasesOpen()"
          role="dialog"
          aria-labelledby="use-cases-window-title"
        >
          <header class="use-cases-window-header">
            <h2 id="use-cases-window-title">Use Cases</h2>
            <p>Open an IoTility application to get started.</p>
          </header>
          <div class="use-cases-logos">
            @for (module of modules; track module.id) {
              <button type="button" class="use-case-logo" (click)="selectModule(module.action)">
                <img [src]="module.icon" [alt]="module.name" />
                <span>{{ module.name }}</span>
              </button>
            }
          </div>
        </section>
    </div>
    <a
      routerLink="/home"
      routerLinkActive="sidebar-nav-active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-nav-item"
    >
      <span class="color-icon" style="--icon: url('/assets/icons/home.svg')" aria-hidden="true"></span>
      <span>Home</span>
    </a>
    <a routerLink="/users" routerLinkActive="sidebar-nav-active" class="sidebar-nav-item">
      <span class="color-icon" style="--icon: url('/assets/icons/users.svg')" aria-hidden="true"></span>
      <span>Users</span>
    </a>
    <a routerLink="/settings" routerLinkActive="sidebar-nav-active" class="sidebar-nav-item">
      <span class="color-icon" style="--icon: url('/assets/icons/settings.svg')" aria-hidden="true"></span>
      <span>Settings</span>
    </a>
    <a routerLink="/billing" routerLinkActive="sidebar-nav-active" class="sidebar-nav-item">
      <span class="color-icon" style="--icon: url('/assets/icons/credit-card.svg')" aria-hidden="true"></span>
      <span>Billing</span>
    </a>
    <a routerLink="/help" routerLinkActive="sidebar-nav-active" class="sidebar-nav-item">
      <span class="color-icon" style="--icon: url('/assets/icons/help-circle.svg')" aria-hidden="true"></span>
      <span>Help</span>
    </a>
  </nav>

  @if (recentApps.apps().length > 0) {
    <div class="flex flex-col items-center gap-3">
      @for (app of recentApps.apps(); track app.id) {
        <div class="relative">
          <button
            type="button"
            (click)="openApp(app)"
            class="fleetpoint-button"
            [attr.aria-label]="'Open ' + app.label"
          >
            <img [src]="app.logoSrc" [alt]="app.label" class="h-10 w-auto" />
          </button>
          <button
            type="button"
            (click)="removeApp(app.id)"
            class="app-close-button"
            [attr.aria-label]="'Remove ' + app.label"
          >
            <img src="assets/icons/x.svg" alt="" aria-hidden="true" />
          </button>
        </div>
      }
    </div>
  }
</aside>
