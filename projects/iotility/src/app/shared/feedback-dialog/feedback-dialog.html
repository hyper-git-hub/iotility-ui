@if (dialog.config(); as config) {
  <div class="dialog-backdrop" [class.dialog-closing]="dialog.closing()" role="presentation" (click)="dialog.cancel()">
    <section
      class="dialog-panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="feedback-dialog-title"
      aria-describedby="feedback-dialog-message"
      (click)="$event.stopPropagation()"
    >
      <div
        class="dialog-icon"
        [class.dialog-icon-success]="config.type === 'success'"
        [class.dialog-icon-warning]="config.type === 'warning'"
        [class.dialog-icon-question]="config.type === 'question'"
        [class.dialog-icon-error]="config.type === 'error'"
        aria-hidden="true"
      >
        <!-- Every dialog icon draws itself in once: outline first, then its mark. -->
        @switch (config.type) {
          @case ('success') {
            <svg class="dialog-glyph draw-in" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" pathLength="1" /></svg>
          }
          @case ('warning') {
            <svg class="dialog-glyph draw-in" viewBox="0 0 24 24"><path d="M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z" pathLength="1" /><path d="M12 8v5M12 17h.01" pathLength="1" /></svg>
          }
          @case ('error') {
            <svg class="dialog-glyph draw-in" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" pathLength="1" /><path d="m9 9 6 6M15 9l-6 6" pathLength="1" /></svg>
          }
          @default {
            <svg class="dialog-glyph draw-in" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" pathLength="1" /><path d="M9.8 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1.3.9-1.3 1.7M12 17h.01" pathLength="1" /></svg>
          }
        }
      </div>
      <h2 id="feedback-dialog-title" class="dialog-title">{{ config.title }}</h2>
      <p id="feedback-dialog-message" class="dialog-message">{{ config.message }}</p>
      <div class="dialog-actions">
        @if (config.showCancel !== false) {
          <button type="button" class="dialog-button-secondary" (click)="dialog.cancel()">
            {{ config.cancelText ?? 'Cancel' }}
          </button>
        }
        <button type="button" class="dialog-button-primary" (click)="dialog.confirm()">
          {{ config.confirmText ?? 'Continue' }}
        </button>
      </div>
    </section>
  </div>
}
