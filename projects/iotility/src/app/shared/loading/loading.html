<main class="loading-shell">
  <section class="loading-content" aria-live="polite" aria-busy="true">
    <div class="loading-hero" aria-hidden="true">
      <div class="loading-logos">
        @if (logoSrc()) {
          <img [src]="logoSrc()" alt="" class="loading-product-logo" />
        } @else {
          <div class="loading-initials">{{ initials() }}</div>
        }
        <div class="loading-separator"></div>
        @if (labelLogoSrc()) {
          <img [src]="labelLogoSrc()" alt="" class="loading-label-logo" />
        } @else {
          <p class="loading-label">{{ label() }}</p>
        }
      </div>
    </div>
    <h1 class="loading-title">{{ title() }}</h1>
    <p class="loading-message">{{ message() }}</p>
    <div class="loading-track" aria-hidden="true">
      <div class="loading-bar"></div>
    </div>
  </section>
</main>
