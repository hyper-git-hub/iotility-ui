<main class="relative grid min-h-screen overflow-hidden bg-brand-950 px-6 text-white">
  <div class="loading-glow" aria-hidden="true"></div>
  <section
    class="relative z-10 m-auto w-full max-w-md text-center"
    aria-live="polite"
    aria-busy="true"
  >
    <div class="mx-auto mb-8 flex items-center justify-center gap-6">
      @if (logoSrc()) {
        <img [src]="logoSrc()" alt="FleetPoint" class="h-10 w-auto max-w-40" />
      } @else {
        <div
          class="grid size-20 place-items-center rounded-3xl border border-brand-400/30 bg-brand-500/20 shadow-2xl shadow-brand-500/30"
        >
          <span class="text-xl font-black">{{ initials() }}</span>
        </div>
      }
      <div class="h-10 w-px bg-white/25" aria-hidden="true"></div>
      @if (labelLogoSrc()) {
        <img [src]="labelLogoSrc()" alt="IoTility" class="h-10 w-auto max-w-40" />
      } @else {
        <p class="text-xs font-bold uppercase tracking-[0.28em] text-brand-300">{{ label() }}</p>
      }
    </div>
    <h1 class="mt-3 text-3xl font-bold tracking-tight">{{ title() }}</h1>
    <p class="mt-2 text-sm text-brand-300">{{ message() }}</p>

    <div class="mt-8 overflow-hidden rounded-full bg-white/10 p-[3px]">
      <div
        class="loading-bar h-1 w-[55%] rounded-full bg-gradient-to-r from-brand-400 via-brand-500 to-info"
      ></div>
    </div>
  </section>
</main>
