<section class="violations-page">
  <header class="heading">
    <div><h1>Violations</h1><p>{{total}} violations · {{critical}} critical · {{pending}} pending review · {{totalFines}} in fines</p></div>
    <div><button class="export" type="button"><span class="color-icon size-4" style="--icon: url('/assets/fleetpoint/icons/export.svg')" aria-hidden="true"></span>Export XLS</button><button class="export" type="button"><span class="color-icon size-4" style="--icon: url('/assets/fleetpoint/icons/export.svg')" aria-hidden="true"></span>Export PDF</button><button class="create" type="button" (click)="manualViolationOpen.set(true)"><span class="color-icon size-4" style="--icon: url('/assets/fleetpoint/icons/plus.svg')" aria-hidden="true"></span>Add Manual Violation</button></div>
  </header>
  <section class="stats">
    <app-stat-card label="Total Violations" [value]="total" tone="brand" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4 3 7 8 9 5-2 8-5 8-9V6l-8-3Z"/><path d="M12 8v5m0 3h.01"/></svg></app-stat-card>
    <app-stat-card label="Critical" [value]="critical" tone="danger" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><path d="m8 3-5 5v8l5 5h8l5-5V8l-5-5H8Z"/><path d="M12 7v6m0 4h.01"/></svg></app-stat-card>
    <app-stat-card label="Pending Review" [value]="pending" tone="warning" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><rect x="5" y="4" width="11" height="16" rx="2"/><path d="M8 8h5M8 12h3"/><circle cx="17" cy="16" r="4"/><path d="M17 14v2l1.5 1"/></svg></app-stat-card>
    <app-stat-card label="Pending Fines" [value]="finesPending" tone="info" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><path d="M5 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M8 7h6M8 11h4"/><circle cx="17" cy="15" r="4"/><path d="M17 13v2l1.5 1"/></svg></app-stat-card>
    <app-stat-card label="Total Fines" [value]="totalFines" tone="danger" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><ellipse cx="9" cy="7" rx="5" ry="2.5"/><path d="M4 7v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V7M4 11v4c0 1.4 2.2 2.5 5 2.5 1 0 1.9-.1 2.7-.4"/><ellipse cx="16" cy="16" rx="4" ry="2"/><path d="M12 16v3c0 1.1 1.8 2 4 2s4-.9 4-2v-3"/></svg></app-stat-card>
    <app-stat-card label="Score Impact" [value]="scoreImpact" tone="warning" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><path d="M4 6h16M4 10h12M4 14h8"/><path d="M16 13v7m0 0-3-3m3 3 3-3"/></svg></app-stat-card>
  </section>
  <nav class="tabs"><a routerLink="all" routerLinkActive="active">All Violations <span>{{total}}</span></a><a routerLink="fines" routerLinkActive="active">Fines &amp; Penalties <span>{{finesPending}}</span></a><a routerLink="configuration" routerLinkActive="active">Configuration</a></nav>
  <router-outlet/>
  <app-manual-violation-form [open]="manualViolationOpen()" (cancelled)="manualViolationOpen.set(false)" (created)="manualViolationOpen.set(false)"/>
</section>
