<app-modal [open]="open()" labelledBy="manual-violation-title" (closed)="cancel()">
  <h2 modal-header id="manual-violation-title">Add Manual Violation</h2>
  <form id="manual-violation-form" class="manual-violation-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="shared-form-field"><span>Driver <b>*</b></span><shared-dropdown class="form-dropdown" [options]="driverOptions" mode="single" align="left" [searchable]="true" searchPlaceholder="Search drivers" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="form.controls.driver.value ? [form.controls.driver.value] : []" (optionSelected)="select('driver',$event)"><button dropdown-trigger type="button">{{label(driverOptions,form.controls.driver.value,'Select driver...')}}</button></shared-dropdown>@if(invalid('driver')){<small class="shared-form-error">Select a driver.</small>}</label>
    <label class="shared-form-field"><span>Category <b>*</b></span><shared-dropdown class="form-dropdown" [options]="categoryOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.category.value]" (optionSelected)="select('category',$event)"><button dropdown-trigger type="button">{{label(categoryOptions,form.controls.category.value,'Select category...')}}</button></shared-dropdown></label>
    <label class="shared-form-field"><span>Violation Type <b>*</b></span><input class="shared-form-control" formControlName="type" placeholder="e.g. MOT Expired, Licence Issue..." [attr.aria-invalid]="invalid('type')"/>@if(invalid('type')){<small class="shared-form-error">Enter a violation type.</small>}</label>
    <label class="shared-form-field"><span>Severity <b>*</b></span><shared-dropdown class="form-dropdown" [options]="severityOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.severity.value]" (optionSelected)="select('severity',$event)"><button dropdown-trigger type="button">{{label(severityOptions,form.controls.severity.value,'Select severity...')}}</button></shared-dropdown></label>
    <label class="shared-form-field full"><span>Description <b>*</b></span><textarea class="shared-form-control" formControlName="description" rows="3" placeholder="Describe the violation..." [attr.aria-invalid]="invalid('description')"></textarea>@if(invalid('description')){<small class="shared-form-error">Enter a description.</small>}</label>
    <label class="shared-form-field"><span>Fine Amount (£)</span><input class="shared-form-control" type="number" min="0" formControlName="fineAmount" placeholder="0 if no fine"/></label>
    <label class="shared-form-field"><span>Fine Due Date</span><shared-date-time-picker mode="date" formControlName="fineDueDate" placeholder="Select due date" ariaLabel="Choose fine due date"/></label>
  </form>
  <div modal-footer class="manual-violation-actions"><button type="button" class="shared-button-secondary" (click)="cancel()">Cancel</button><button type="submit" form="manual-violation-form" class="shared-button-primary">Add Violation</button></div>
</app-modal>
