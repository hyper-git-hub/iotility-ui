<section class="driver-tab-content tab-enter">
  <ui-blocking-loader [visible]="actionLoading()" [compact]="true" label="Deleting manager..." />
  <div class="tab-action"><button class="add-driver" (click)="openCreate()"><span class="color-icon size-4" style="--icon: url('/assets/fleetpoint/icons/plus.svg')" aria-hidden="true"></span>Add Manager</button></div>
  @if (error()) { <section class="drivers-error">{{ error() }}</section> }

  @if (initialLoading()) {
    <ui-data-table-skeleton title="Manager List" [columns]="columns.length" [columnLabels]="columnLabels" [rows]="5" [showToolbar]="true" [leadingVisual]="true" />
  } @else {
    <div class="driver-table-wrap" [class.refreshing]="refreshing()">
      @if (refreshing()) { <div class="driver-refresh-progress"><i></i></div> }
      <shared-data-table title="Manager List" [columns]="columns" [rows]="rows()" [actions]="actions" [clientSideSearch]="false" [showPrimaryAction]="false" [showExport]="false" [pagination]="{ totalItems: total(), pageSize: limit, page: offset() / limit + 1, loading: loading() }" (pageChange)="goToPage($event)" searchPlaceholder="Search managers or employee ID" (searchChange)="searchChanged($event)" (rowAction)="action($event)" />
    </div>
  }

  <app-manager-form [open]="formOpen()" [manager]="selected()" (cancelled)="close()" (saved)="saved()" />
</section>
