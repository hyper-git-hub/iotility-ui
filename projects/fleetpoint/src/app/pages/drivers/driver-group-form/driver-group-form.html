<ui-blocking-loader [visible]="loading()" [compact]="true" [label]="editing() ? 'Updating driver group...' : 'Creating driver group...'" />
<app-modal [open]="open()" [busy]="loading()" size="lg" labelledBy="add-driver-group-title" (closed)="cancel()">
  <div modal-header><h2 id="add-driver-group-title">{{ editing() ? 'Update Driver Group' : 'Create Driver Group' }}</h2><p class="form-subtitle">{{ editing() ? 'Update group membership' : 'Organise drivers into a group' }}</p></div>
  <form id="driver-group-form" class="group-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (error()) { <div class="form-error wide" role="alert">{{ error() }}</div> }
    <label class="shared-form-field"><span>Name <b>*</b></span><input class="shared-form-control" formControlName="name" placeholder="Enter name" />@if (submitted() && form.controls.name.invalid) { <small class="field-error">Enter a name using letters and single spaces only.</small> }</label>
    <label class="shared-form-field"><span>Drivers <b>*</b></span><shared-dropdown class="form-dropdown" [options]="driverOptions()" mode="multi" align="left" placement="bottom" [searchable]="true" searchPlaceholder="Search drivers" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="form.controls.drivers_list.value" (selectionChange)="selectionChanged($event)"><button dropdown-trigger type="button" (click)="loadDrivers()"><span>{{ optionsLoading() ? 'Loading drivers...' : selectedLabel() }}</span></button></shared-dropdown>@if (submitted() && !form.controls.drivers_list.value.length) { <small class="field-error">Select at least one driver.</small> }</label>
    @if (editing()) { <div class="group-count wide"><span>Total drivers:</span><strong>{{ group()?.driver_count ?? 0 }}</strong><small>currently assigned</small></div> }
  </form>
  <div modal-footer class="group-form-actions"><button type="button" class="shared-button-secondary" [disabled]="loading()" (click)="cancel()">Cancel</button><button type="submit" form="driver-group-form" class="shared-button-primary" [disabled]="loading() || optionsLoading()">{{ editing() ? 'Update Driver Group' : 'Create Driver Group' }}</button></div>
</app-modal>
