<section class="driver-tab-content tab-enter"><ui-blocking-loader [visible]="loading()" label="Loading driver groups" message="Getting the latest group records..."/><ui-blocking-loader [visible]="actionLoading()" [compact]="true" label="Deleting driver group..."/><div class="tab-action smooth-reveal tab-reveal-action"><button class="add-driver" (click)="openCreate()">+ Add Driver Group</button></div>@if(error()){<section class="drivers-error">{{error()}}</section>}<shared-data-table class="smooth-reveal tab-reveal-table" title="Driver Groups" [subtitle]="'Showing '+start()+'–'+end()+' of '+total()" [columns]="columns" [rows]="rows()" [actions]="actions" [clientSideSearch]="false" [showPrimaryAction]="false" [showExport]="false" searchPlaceholder="Search groups" (searchChange)="searchChanged($event)" (rowAction)="handleAction($event)"/><nav class="driver-pagination smooth-reveal tab-reveal-pagination"><span>Showing {{start()}}–{{end()}} of {{total()}}</span><div><button [disabled]="offset()===0" (click)="previous()">Previous</button><button [disabled]="offset()+limit>=total()" (click)="next()">Next</button></div></nav><app-driver-group-form [open]="formOpen()" [group]="selectedGroup()" (cancelled)="closeForm()" (created)="saved()"/></section>
