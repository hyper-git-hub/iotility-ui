<section class="driver-tab-content tab-enter">
  <ui-blocking-loader [visible]="actionLoading()" [compact]="true" label="Deleting driver group..." />
  <div class="tab-action"><button class="add-driver" (click)="openCreate()">+ Add Driver Group</button></div>
  @if (error()) { <section class="drivers-error">{{ error() }}</section> }

  @if (initialLoading()) {
    <ui-data-table-skeleton title="Driver Groups" [columns]="columns.length" [columnLabels]="columnLabels" [rows]="5" [showToolbar]="true" />
  } @else {
    <div class="driver-table-wrap" [class.refreshing]="refreshing()">
      @if (refreshing()) { <div class="driver-refresh-progress"><i></i></div> }
      <shared-data-table title="Driver Groups" [subtitle]="'Showing ' + start() + '–' + end() + ' of ' + total()" [columns]="columns" [rows]="rows()" [actions]="actions" [clientSideSearch]="false" [showPrimaryAction]="false" [showExport]="false" searchPlaceholder="Search groups" (searchChange)="searchChanged($event)" (rowAction)="handleAction($event)" />
    </div>
  }

  <nav class="driver-pagination">
    @if (initialLoading()) { <ui-skeleton width="8rem" height="0.75rem" radius="0.3rem" /> }
    @else { <span>Showing {{ start() }}–{{ end() }} of {{ total() }}</span> }
    <div><button [disabled]="loading() || offset() === 0" (click)="previous()">Previous</button><button [disabled]="loading() || offset() + limit >= total()" (click)="next()">Next</button></div>
  </nav>
  <app-driver-group-form [open]="formOpen()" [group]="selectedGroup()" (cancelled)="closeForm()" (created)="saved()" />
</section>
