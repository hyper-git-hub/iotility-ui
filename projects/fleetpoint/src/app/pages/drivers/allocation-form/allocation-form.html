<ui-blocking-loader [visible]="loading()" [compact]="true" label="Creating allocation..." />
<app-modal [open]="open()" [busy]="loading()" size="lg" labelledBy="allocation-form-title" (closed)="cancel()">
  <div modal-header><h2 id="allocation-form-title">{{ editing() ? 'Update Allocation' : lockVehicle() ? 'Assign Driver' : 'Create Allocation' }}</h2><p class="form-subtitle">{{ editing() ? 'Update driver assignment details' : 'Assign drivers to a vehicle' }}</p></div>
  <form id="allocation-form" class="allocation-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (error()) {
      <div class="form-error wide">{{ error() }}</div>
    }
    <label class="shared-form-field"
      ><span>Vehicle <b>*</b></span
      ><shared-dropdown
        class="form-dropdown"
        [options]="vehicleOptions()"
        mode="single"
        align="left"
        [searchable]="true"
        searchPlaceholder="Search vehicles"
        [showOptionIcons]="false"
        [matchTriggerWidth]="true"
        [selected]="[form.controls.vehicle.value]"
        (optionSelected)="selectVehicle($event)"
        ><button dropdown-trigger type="button" [disabled]="lockVehicle()">
          <span>{{
            optionsLoading()
              ? 'Loading vehicles...'
              : label(vehicleOptions(), form.controls.vehicle.value, 'Select vehicle')
          }}</span>
        </button></shared-dropdown
      >
      @if (submitted() && form.controls.vehicle.invalid) {
        <small class="field-error">Select a vehicle.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Drivers <b>*</b></span
      ><shared-dropdown
        class="form-dropdown"
        [options]="driverOptions()"
        mode="multi"
        align="left"
        [searchable]="true"
        searchPlaceholder="Search drivers"
        [showOptionIcons]="false"
        [matchTriggerWidth]="true"
        [selected]="form.controls.drivers.value"
        (selectionChange)="selectDrivers($event)"
        ><button dropdown-trigger type="button">
          <span>{{ optionsLoading() ? 'Loading drivers...' : driversLabel() }}</span>
        </button></shared-dropdown
      >
      @if (submitted() && !form.controls.drivers.value.length) {
        <small class="field-error">Select at least one driver.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Start Date <b>*</b></span
      ><shared-date-time-picker
        mode="date"
        formControlName="start_date"
        ariaLabel="Choose allocation start date"
      />
      @if (submitted() && form.controls.start_date.invalid) {
        <small class="field-error">Select a start date.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>End Date <b>*</b></span
      ><shared-date-time-picker
        mode="date"
        formControlName="end_date"
        ariaLabel="Choose allocation end date"
      />
      @if (submitted() && form.controls.end_date.invalid) {
        <small class="field-error">Select an end date.</small>
      }
    </label>
  </form>
  <div modal-footer class="allocation-form-footer">
    <button type="button" class="shared-button-secondary" [disabled]="loading()" (click)="cancel()">
      Cancel</button
    ><button
      type="submit"
      form="allocation-form"
      class="shared-button-primary"
      [disabled]="loading() || optionsLoading()"
    >
      {{ editing() ? 'Update Allocation' : 'Create Allocation' }}
    </button>
  </div>
</app-modal>
