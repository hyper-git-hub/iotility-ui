<ui-blocking-loader [visible]="loading()" [compact]="true" [label]="editing() ? 'Updating driver...' : 'Creating driver...'" />
<app-modal [open]="open()" [busy]="loading()" size="xl" labelledBy="add-driver-title" (closed)="cancel()">
  <h2 modal-header id="add-driver-title">{{ editing() ? 'Edit Driver' : 'Add Driver' }}</h2>
  <form id="driver-form" class="driver-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (error()) { <div class="form-error wide" role="alert">{{ error() }}</div> }
    <label class="shared-form-field"><span>Name *</span><input class="shared-form-control" formControlName="name" placeholder="Enter name" />@if (submitted() && form.controls.name.invalid) { <small class="field-error">Name is required.</small> }</label>
    <label class="shared-form-field"><span>Employee ID *</span><input class="shared-form-control" formControlName="employee_id" placeholder="Enter employee ID" />@if (submitted() && form.controls.employee_id.invalid) { <small class="field-error">Employee ID is required.</small> }</label>
    <label class="shared-form-field"><span>Birth Date *</span><input type="date" class="shared-form-control" formControlName="dob" />@if (submitted() && form.controls.dob.invalid) { <small class="field-error">Birth date is required.</small> }</label>
    <label class="shared-form-field"><span>Joining Date *</span><input type="date" class="shared-form-control" formControlName="data_joined" />@if (submitted() && form.controls.data_joined.invalid) { <small class="field-error">Joining date is required.</small> }</label>
    <label class="shared-form-field"><span>Salary *</span><input type="number" min="0" class="shared-form-control" formControlName="salary" placeholder="Enter salary" />@if (submitted() && form.controls.salary.invalid) { <small class="field-error">Enter a valid salary.</small> }</label>
    <label class="shared-form-field"><span>Marital Status *</span><shared-dropdown class="form-dropdown" [options]="maritalOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.marital_status.value]" (optionSelected)="selectMarital($event)"><button dropdown-trigger type="button"><span>{{ optionLabel(maritalOptions, form.controls.marital_status.value, 'Select status') }}</span></button></shared-dropdown>@if (submitted() && form.controls.marital_status.invalid) { <small class="field-error">Marital status is required.</small> }</label>
    <label class="shared-form-field"><span>Gender *</span><shared-dropdown class="form-dropdown" [options]="genderOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.gender.value]" (optionSelected)="selectGender($event)"><button dropdown-trigger type="button"><span>{{ optionLabel(genderOptions, form.controls.gender.value, 'Select gender') }}</span></button></shared-dropdown>@if (submitted() && form.controls.gender.invalid) { <small class="field-error">Gender is required.</small> }</label>
    <label class="shared-form-field"><span>Contact Number *</span><input type="tel" class="shared-form-control" formControlName="phone" />@if (submitted() && form.controls.phone.invalid) { <small class="field-error">Enter a valid contact number.</small> }</label>
    <label class="shared-form-field"><span>Licence Number *</span><input class="shared-form-control" formControlName="licence_number" maxlength="20" placeholder="Enter licence number" />@if (submitted() && form.controls.licence_number.invalid) { <small class="field-error">Licence number must be 9–20 characters.</small> }</label>
    <label class="shared-form-field"><span>Licence Expiry Date *</span><input type="date" class="shared-form-control" formControlName="licence_expiry_date" />@if (submitted() && form.controls.licence_expiry_date.invalid) { <small class="field-error">Licence expiry date is required.</small> }</label>
    <label class="shared-form-field"><span>Email *</span><input type="email" class="shared-form-control" formControlName="email" placeholder="Enter email" />@if (submitted() && form.controls.email.invalid) { <small class="field-error">Enter a valid email address.</small> }</label>
    @if (!editing()) { <label class="shared-form-field"><span>Password *</span><span class="password-field"><input [type]="showPassword() ? 'text' : 'password'" class="shared-form-control" formControlName="password" maxlength="15" placeholder="8–15 characters" /><button type="button" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">{{ showPassword() ? 'Hide' : 'Show' }}</button></span>@if (submitted() && form.controls.password.invalid) { <small class="field-error">Use 8–15 characters with uppercase, lowercase and a number.</small> }</label> }
    <label class="shared-form-field"><span>Driver Group</span><shared-dropdown class="form-dropdown" [options]="groupOptions()" mode="single" align="left" [searchable]="true" searchPlaceholder="Search groups" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.group.value]" (optionSelected)="selectGroup($event)"><button dropdown-trigger type="button"><span>{{ optionLabel(groupOptions(), form.controls.group.value, 'No group') }}</span></button></shared-dropdown></label>
    @if (editing()) { <label class="shared-form-field"><span>Status *</span><shared-dropdown class="form-dropdown" [options]="statusOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.status.value]" (optionSelected)="selectStatus($event)"><button dropdown-trigger type="button"><span>{{ optionLabel(statusOptions, form.controls.status.value, 'Select status') }}</span></button></shared-dropdown></label> }
    <label class="poi-field"><input type="checkbox" formControlName="poi" /><span></span><strong>P.O.I</strong></label>
    <section class="driver-picture wide"><div class="picture-preview">@if (imagePreview()) { <img [src]="imagePreview()" alt="Driver preview" /> } @else { <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="34" r="20"/><path d="M12 96c2-27 15-40 38-40s36 13 38 40"/></svg> }</div><div><strong>Driver Picture</strong><p>PNG or JPG, up to 5 MB</p><label><input type="file" accept="image/png,image/jpeg,image/webp" (change)="chooseImage($event)" />Choose picture</label></div></section>
  </form>
  <div modal-footer class="form-footer"><button type="button" class="shared-button-secondary" [disabled]="loading()" (click)="cancel()">Close</button><button type="submit" form="driver-form" class="shared-button-primary" [disabled]="form.invalid || loading()">{{ editing() ? 'Update Driver' : 'Save Driver' }}</button></div>
</app-modal>
