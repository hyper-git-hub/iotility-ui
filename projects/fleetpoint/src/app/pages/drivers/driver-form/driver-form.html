<ui-blocking-loader
  [visible]="loading()"
  [compact]="true"
  [label]="editing() ? 'Updating driver...' : 'Creating driver...'"
/>
<app-modal
  [open]="open()"
  [busy]="loading()"
  size="lg"
  labelledBy="add-driver-title"
  (closed)="cancel()"
>
  <div modal-header>
    <h2 id="add-driver-title">{{ editing() ? 'Update Driver' : 'Create Driver' }}</h2>
    <p class="form-subtitle">{{ editing() ? 'Update driver details' : 'Add a new driver record' }}</p>
  </div>
  <form id="driver-form" class="driver-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (error()) {
      <div class="form-error wide" role="alert">{{ error() }}</div>
    }
    <label class="shared-form-field"
      ><span>Name <b>*</b></span
      ><input class="shared-form-control" formControlName="name" placeholder="Enter name" />
      @if (submitted() && form.controls.name.invalid) {
        <small class="field-error">Name is required.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Employee ID <b>*</b></span
      ><input
        class="shared-form-control"
        formControlName="employee_id"
        placeholder="Enter employee ID"
      />
      @if (submitted() && form.controls.employee_id.invalid) {
        <small class="field-error">Employee ID is required.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Birth Date <b>*</b></span
      ><shared-date-time-picker mode="date" formControlName="dob" ariaLabel="Choose birth date" />
      @if (submitted() && form.controls.dob.invalid) {
        <small class="field-error">Birth date is required.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Joining Date <b>*</b></span
      ><shared-date-time-picker
        mode="date"
        formControlName="data_joined"
        ariaLabel="Choose joining date"
      />
      @if (submitted() && form.controls.data_joined.invalid) {
        <small class="field-error">Joining date is required.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Salary <b>*</b></span
      ><input
        type="number"
        min="0"
        class="shared-form-control"
        formControlName="salary"
        placeholder="Enter salary"
      />
      @if (submitted() && form.controls.salary.invalid) {
        <small class="field-error">Enter a valid salary.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Marital Status <b>*</b></span
      ><shared-dropdown
        class="form-dropdown"
        [options]="maritalOptions"
        mode="single"
        align="left"
        [showOptionIcons]="false"
        [matchTriggerWidth]="true"
        [selected]="[form.controls.marital_status.value]"
        (optionSelected)="selectMarital($event)"
        ><button dropdown-trigger type="button">
          <span>{{
            optionLabel(maritalOptions, form.controls.marital_status.value, 'Select status')
          }}</span>
        </button></shared-dropdown
      >
      @if (submitted() && form.controls.marital_status.invalid) {
        <small class="field-error">Marital status is required.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Gender <b>*</b></span
      ><shared-dropdown
        class="form-dropdown"
        [options]="genderOptions"
        mode="single"
        align="left"
        [showOptionIcons]="false"
        [matchTriggerWidth]="true"
        [selected]="[form.controls.gender.value]"
        (optionSelected)="selectGender($event)"
        ><button dropdown-trigger type="button">
          <span>{{ optionLabel(genderOptions, form.controls.gender.value, 'Select gender') }}</span>
        </button></shared-dropdown
      >
      @if (submitted() && form.controls.gender.invalid) {
        <small class="field-error">Gender is required.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Contact Number <b>*</b></span
      ><input type="tel" class="shared-form-control" formControlName="phone" />
      @if (submitted() && form.controls.phone.invalid) {
        <small class="field-error">Enter a valid contact number.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Licence Number <b>*</b></span
      ><input
        class="shared-form-control"
        formControlName="licence_number"
        maxlength="20"
        placeholder="Enter licence number"
      />
      @if (submitted() && form.controls.licence_number.invalid) {
        <small class="field-error">Licence number must be 9–20 characters.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Licence Expiry Date <b>*</b></span
      ><shared-date-time-picker
        mode="date"
        formControlName="licence_expiry_date"
        ariaLabel="Choose licence expiry date"
      />
      @if (submitted() && form.controls.licence_expiry_date.invalid) {
        <small class="field-error">Licence expiry date is required.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Email <b>*</b></span
      ><input
        type="email"
        class="shared-form-control"
        formControlName="email"
        placeholder="Enter email"
      />
      @if (submitted() && form.controls.email.invalid) {
        <small class="field-error">Enter a valid email address.</small>
      }
    </label>
    @if (!editing()) {
      <label class="shared-form-field"
        ><span>Password <b>*</b></span
        ><span class="password-field"
          ><input
            [type]="showPassword() ? 'text' : 'password'"
            class="shared-form-control"
            formControlName="password"
            maxlength="15"
            placeholder="8–15 characters"
          /><button
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button></span
        >
        @if (submitted() && form.controls.password.invalid) {
          <small class="field-error"
            >Use 8–15 characters with uppercase, lowercase and a number.</small
          >
        }
      </label>
    }
    <label class="shared-form-field"
      ><span>Driver Group</span
      ><shared-dropdown
        class="form-dropdown"
        [options]="groupOptions()"
        mode="single"
        align="left"
        [searchable]="true"
        searchPlaceholder="Search groups"
        [showOptionIcons]="false"
        [matchTriggerWidth]="true"
        [selected]="[form.controls.group.value]"
        (optionSelected)="selectGroup($event)"
        ><button dropdown-trigger type="button">
          <span>{{ optionLabel(groupOptions(), form.controls.group.value, 'No group') }}</span>
        </button></shared-dropdown
      ></label
    >
    @if (editing()) {
      <label class="shared-form-field"
        ><span>Status <b>*</b></span
        ><shared-dropdown
          class="form-dropdown"
          [options]="statusOptions"
          mode="single"
          align="left"
          [showOptionIcons]="false"
          [matchTriggerWidth]="true"
          [selected]="[form.controls.status.value]"
          (optionSelected)="selectStatus($event)"
          ><button dropdown-trigger type="button">
            <span>{{
              optionLabel(statusOptions, form.controls.status.value, 'Select status')
            }}</span>
          </button></shared-dropdown
        ></label
      >
    }
    <label class="poi-field"
      ><input type="checkbox" formControlName="poi" /><span></span><strong>P.O.I</strong></label
    >
    <section class="driver-picture wide">
      <div class="picture-preview">
        @if (imagePreview()) {
          <img [src]="imagePreview()" alt="Driver preview" />
        } @else {
          <img class="picture-placeholder" src="assets/fleetpoint/icons/avatar-placeholder.svg" alt="" aria-hidden="true" />
        }
      </div>
      <div>
        <strong>Driver Picture</strong>
        <p>PNG or JPG, up to 5 MB</p>
        <label
          ><input
            type="file"
            accept="image/png,image/jpeg,image/webp"
            (change)="chooseImage($event)"
          />Choose picture</label
        >
      </div>
    </section>
  </form>
  <div modal-footer class="driver-form-actions">
    <button type="button" class="shared-button-secondary" [disabled]="loading()" (click)="cancel()">
      Cancel</button
    ><button
      type="submit"
      form="driver-form"
      class="shared-button-primary"
      [disabled]="loading()"
    >
      {{ editing() ? 'Update Driver' : 'Create Driver' }}
    </button>
  </div>
</app-modal>
