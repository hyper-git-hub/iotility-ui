<app-modal [open]="open()" labelledBy="work-order-form-title" (closed)="cancel()">
  <h2 modal-header id="work-order-form-title">New Work Order</h2>
  <form id="work-order-form" class="work-order-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="shared-form-field"><span>Vehicle <b>*</b></span><shared-dropdown class="form-dropdown" [options]="vehicleOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search vehicles" [selected]="[form.controls.vehicle.value]" (optionSelected)="select('vehicle',$event)"><button dropdown-trigger type="button">{{label(vehicleOptions,form.controls.vehicle.value,'Select vehicle...')}}</button></shared-dropdown>@if(invalid('vehicle')){<small class="shared-form-error">Select a vehicle.</small>}</label>
    <label class="shared-form-field"><span>Priority <b>*</b></span><shared-dropdown class="form-dropdown" [options]="priorityOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.priority.value]" (optionSelected)="select('priority',$event)"><button dropdown-trigger type="button">{{label(priorityOptions,form.controls.priority.value,'Select priority...')}}</button></shared-dropdown></label>
    <label class="shared-form-field"><span>Type <b>*</b></span><shared-dropdown class="form-dropdown" [options]="typeOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.type.value]" (optionSelected)="select('type',$event)"><button dropdown-trigger type="button">{{label(typeOptions,form.controls.type.value,'Select type...')}}</button></shared-dropdown></label>
    <label class="shared-form-field"><span>Workshop</span><shared-dropdown class="form-dropdown" [options]="workshopOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.workshop.value]" (optionSelected)="select('workshop',$event)"><button dropdown-trigger type="button">{{label(workshopOptions,form.controls.workshop.value,'Unassigned')}}</button></shared-dropdown></label>
    <label class="shared-form-field full"><span>Service Type <b>*</b></span><input class="shared-form-control" formControlName="service" placeholder="e.g. Oil Change, Brake Inspection, Full Service..." [attr.aria-invalid]="invalid('service')"/>@if(invalid('service')){<small class="shared-form-error">Enter the required service.</small>}</label>
    <label class="shared-form-field full"><span>Description</span><textarea class="shared-form-control" formControlName="description" rows="3" placeholder="Describe the issue or service required..."></textarea></label>
    <label class="shared-form-field"><span>Est. Cost (£)</span><input class="shared-form-control" type="number" min="0" formControlName="estimatedCost"/></label>
    <label class="shared-form-field"><span>Target Date <b>*</b></span><shared-date-time-picker mode="date" formControlName="targetDate" placeholder="Select target date" ariaLabel="Choose work order target date"/>@if(invalid('targetDate')){<small class="shared-form-error">Select a target date.</small>}</label>
  </form>
  <div modal-footer class="work-order-form-actions"><button type="button" class="shared-button-secondary" (click)="cancel()">Cancel</button><button type="submit" form="work-order-form" class="shared-button-primary">Raise Work Order</button></div>
</app-modal>
