<app-modal [open]="open()" labelledBy="work-order-form-title" (closed)="cancel()">
  <h2 modal-header id="work-order-form-title">New Work Order</h2>
  <form id="work-order-form" class="work-order-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="shared-form-field"><span>Vehicle <b>*</b></span><shared-dropdown class="form-dropdown" [options]="vehicleOptions()" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search vehicles" [selected]="[form.controls.vehicle.value]" (optionSelected)="select('vehicle',$event)"><button dropdown-trigger type="button">{{label(vehicleOptions(),form.controls.vehicle.value,'Select vehicle...')}}</button></shared-dropdown>@if(invalid('vehicle')){<small class="shared-form-error">Select a vehicle.</small>}</label>
    <label class="shared-form-field"><span>Service Type <b>*</b></span><shared-dropdown class="form-dropdown" [options]="serviceOptions()" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search services" [selected]="[form.controls.serviceType.value]" (optionSelected)="select('serviceType',$event)"><button dropdown-trigger type="button">{{label(serviceOptions(),form.controls.serviceType.value,'Select service...')}}</button></shared-dropdown>@if(invalid('serviceType')){<small class="shared-form-error">Select a service type.</small>}</label>
    <label class="shared-form-field"><span>Title <b>*</b></span><input class="ui-control" formControlName="name" placeholder="e.g. Car Oil Change" [attr.aria-invalid]="invalid('name')"/>@if(invalid('name')){<small class="shared-form-error">Enter a title.</small>}</label>
    <label class="shared-form-field"><span>Workshop</span><shared-dropdown class="form-dropdown" [options]="workshopOptions()" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.workshop.value]" (optionSelected)="select('workshop',$event)"><button dropdown-trigger type="button">{{label(workshopOptions(),form.controls.workshop.value,'Unassigned')}}</button></shared-dropdown></label>
    <label class="shared-form-field full"><span>Description</span><textarea class="ui-control" formControlName="description" rows="3" placeholder="Describe the issue or service required..."></textarea></label>
    <label class="shared-form-field"><span>Est. Cost{{currency()?' ('+currency()+')':''}}</span><input class="ui-control" type="number" min="0" formControlName="estimatedCost" placeholder="0"/>@if(invalid('estimatedCost')){<small class="shared-form-error">Cost can't be negative.</small>}</label>
    <label class="shared-form-field"><span>Next Maintenance</span><shared-date-time-picker mode="date" formControlName="nextDate" placeholder="Select date" ariaLabel="Choose next maintenance date"/></label>
    @if(error()){<p class="shared-form-error full">{{error()}}</p>}
  </form>
  <div modal-footer class="work-order-form-actions"><button type="button" class="shared-button-secondary" (click)="cancel()">Cancel</button><button type="submit" form="work-order-form" class="shared-button-primary" [disabled]="saving()">{{saving()?'Raising…':'Raise Work Order'}}</button></div>
</app-modal>
