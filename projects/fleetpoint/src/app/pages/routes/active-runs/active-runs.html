<nav class="run-status-chips">@for(option of options;track option.id){<button type="button" [class.active]="status()===option.id" (click)="status.set(option.id)">{{option.id==='all'?'All Runs':option.label}} ({{count(option.id)}})</button>}</nav>
@if(!loaded()){<ui-data-table-skeleton title="Route Runs" [columns]="columns.length" [columnLabels]="columnLabels" [rows]="6" [leadingVisual]="true" [twoLineFirstColumn]="true" [minTableWidth]="1360"/>}@else{
<shared-data-table title="Route Runs" [subtitle]="'Showing '+filtered().length+' of '+runs().length+' runs'" [columns]="columns" [rows]="rows()" [clientSideSearch]="false" [showExport]="false" [showPrimaryAction]="false" [minTableWidth]="1360" [actions]="actions" searchPlaceholder="Search route, driver or vehicle..." (searchChange)="search.set($event)"/>
}
