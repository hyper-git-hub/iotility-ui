<section class="routes-page"><header class="heading"><div><h1>Routes</h1><p>{{total}} routes · {{enRoute}} en route · {{compliance}}% avg compliance</p></div><div><button class="export" type="button"><img src="assets/fleetpoint/icons/export.svg" alt="" aria-hidden="true"/>Export</button><button class="create" type="button" (click)="routeFormOpen.set(true)">+ Create Route</button></div></header>
<section class="stats"><app-stat-card label="Total Routes" [value]="total" tone="brand" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="m7.5 16.5 9-9"/></svg></app-stat-card><app-stat-card label="En Route" [value]="enRoute" tone="brand" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><path d="m9 6 8 6-8 6V6Z"/></svg></app-stat-card><app-stat-card label="Scheduled" [value]="scheduled" tone="info" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></app-stat-card><app-stat-card label="Completed Today" [value]="completed" tone="success" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8 12 3 3 5-6"/></svg></app-stat-card><app-stat-card label="Avg Compliance" [value]="compliance+'%'" tone="warning" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><path d="M5 19V9M10 19V5M15 19v-7M20 19V8"/></svg></app-stat-card><app-stat-card label="Auto-Dispatched" [value]="auto" tone="info" [compact]="true"><svg stat-card-icon viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M9 12h.01M15 12h.01M12 7V4"/></svg></app-stat-card></section>
<nav class="tabs"><a routerLink="library" routerLinkActive="active">Routes Library <span>{{total}}</span></a><a routerLink="active-runs" routerLinkActive="active">Active Runs <span>{{enRoute+scheduled}}</span></a><a routerLink="dispatch" routerLinkActive="active">Dispatch</a><a routerLink="adherence" routerLinkActive="active">Adherence</a></nav>
<router-outlet/><app-route-form [open]="routeFormOpen()" (cancelled)="routeFormOpen.set(false)" (created)="createRoute($event)"/></section>
