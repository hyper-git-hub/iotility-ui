<section class="dispatch-layout">
<article class="dispatch-form-panel fleet-surface"><h2 class="fleet-heading">Dispatch a Route</h2>
<label class="field"><span>Dispatch Mode</span><div class="mode-switch"><button type="button" [class.active]="mode()==='manual'" (click)="mode.set('manual')">Manual</button><button type="button" [class.active]="mode()==='suggested'" (click)="mode.set('suggested')">Suggested</button><button type="button" [class.active]="mode()==='auto'" (click)="mode.set('auto')">Auto</button></div></label>
<label class="field"><span>Select Route <b>*</b></span><shared-dropdown class="dropdown" [options]="routeOptions" mode="single" align="left" [searchable]="true" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[route()]" (optionSelected)="select('route',$event)"><button dropdown-trigger class="fleet-control" type="button">{{label(routeOptions,route(),'Choose route...')}}</button></shared-dropdown></label>
<label class="field"><span>Assign Driver <b>*</b></span><shared-dropdown class="dropdown" [options]="driverOptions" mode="single" align="left" [searchable]="true" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[driver()]" (optionSelected)="select('driver',$event)"><button dropdown-trigger class="fleet-control" type="button">{{label(driverOptions,driver(),'Select driver...')}}</button></shared-dropdown></label>
<label class="field"><span>Assign Vehicle</span><shared-dropdown class="dropdown" [options]="vehicleOptions" mode="single" align="left" [searchable]="true" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[vehicle()]" (optionSelected)="select('vehicle',$event)"><button dropdown-trigger class="fleet-control" type="button">{{label(vehicleOptions,vehicle(),'Select vehicle...')}}</button></shared-dropdown></label>
<div class="dates"><label class="field"><span>Start Date/Time <b>*</b></span><shared-date-time-picker mode="datetime" [value]="start()" placeholder="Select start date and time" (valueChange)="start.set($event)"/></label><label class="field"><span>End Date/Time <b>*</b></span><shared-date-time-picker mode="datetime" [value]="end()" [min]="start()" placeholder="Select end date and time" (valueChange)="end.set($event)"/></label></div>
<label class="field"><span>Link to Job (optional)</span><shared-dropdown class="dropdown" [options]="jobOptions" mode="single" align="left" placement="top" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[job()]" (optionSelected)="select('job',$event)"><button dropdown-trigger class="fleet-control" type="button">{{label(jobOptions,job(),'No job linked')}}</button></shared-dropdown></label>
<button class="submit" type="button">⚡ Dispatch Route</button></article>
<article class="availability-panel fleet-surface"><h2 class="fleet-heading">Driver &amp; Vehicle Availability</h2><div class="availability-list">@for(item of availability;track item.name){<button type="button" class="availability-row fleet-status-success" [class.fleet-status-warning]="item.status==='Scheduled'" [class.fleet-status-danger]="item.status==='En Route'" [class.scheduled]="item.status==='Scheduled'" [class.en-route]="item.status==='En Route'" (click)="driver.set(item.name);vehicle.set(item.vehicle)"><span class="avatar">{{item.initials}}<i></i></span><span><strong class="fleet-heading">{{item.name}}</strong><small class="fleet-muted">{{item.vehicle}} · Score {{item.score}}</small></span><b>{{item.status}}</b></button>}</div></article>
</section>
