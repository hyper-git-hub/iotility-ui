<shared-data-table title="Route Library" [subtitle]="'Showing '+filtered().length+' of '+rows().length+' routes · Click a row to view stops'" [columns]="columns" [rows]="rows()" [clientSideSearch]="false" [showExport]="false" [showPrimaryAction]="false" [minTableWidth]="1320" [actions]="actions" [expandableRows]="true" [headerFilterOptions]="fleetOptions" [headerFilterSelected]="[fleet()]" headerFilterTitle="Fleet" [headerFilterLabel]="label()" searchPlaceholder="Search route, location or fleet..." (searchChange)="search.set($event)" (headerFilterChange)="selectFleet($event)" (rowAction)="handleAction($event)">
  <ng-template tableExpandedRow let-row><section class="route-stops"><h3>{{row['route']}} — Stops</h3><div class="stop-timeline">@for(stop of routeStops(row);track stop.name;let first=$first;let last=$last;let index=$index){<div class="stop-item"><span class="stop-marker" [class.start]="first" [class.finish]="last">{{first?'▶':last?'◆':index+1}}</span><article><strong>{{stop.name}}</strong><small>{{stop.address}}</small><em>Dwell: {{stop.dwell}}</em></article></div>}</div></section></ng-template>
</shared-data-table>
