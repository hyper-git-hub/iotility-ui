<section class="vehicles-page">
  <ui-blocking-loader [visible]="loading()" label="Loading vehicles" message="Getting the latest vehicle inventory..." />
  <ui-blocking-loader [visible]="actionLoading()" [compact]="true" label="Deleting vehicle..." />

  <header class="vehicles-heading smooth-reveal">
    <div><h1>Vehicles</h1><p>{{ total() }} vehicles in inventory</p></div>
    <button type="button" class="add-vehicle" (click)="formOpen.set(true)">+ Add Vehicle</button>
  </header>

  <section class="fleet-status-card smooth-reveal reveal-status">
    <div class="status-title"><span class="live-dot"></span><strong>Vehicle Inventory</strong><small>{{ total() }} total vehicles</small></div>
    <div class="status-bar"><i class="moving" [style.flex]="active() || 1"></i><i class="alert" [style.flex]="inactive() || 1"></i><i class="offline" [style.flex]="unassigned() || 1"></i></div>
    <div class="status-pills">
      <span class="moving"><i></i>Active {{ active() }}</span>
      <span class="alert"><i></i>Inactive {{ inactive() }}</span>
      <span class="offline"><i></i>Fleet unassigned {{ unassigned() }}</span>
    </div>
  </section>

  <section class="vehicle-filters smooth-reveal reveal-attention" aria-label="Vehicle filters">
    <div class="filter-controls">
      <label><span>Fleet</span><shared-dropdown class="filter-dropdown" [options]="fleetDropdownOptions()" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search fleets" [selected]="[fleetId()]" (optionSelected)="selectFleet($event)"><button dropdown-trigger type="button"><span>{{ selectedLabel(fleetDropdownOptions(), fleetId(), 'All fleets') }}</span><svg viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></svg></button></shared-dropdown></label>
      <label><span>Category</span><shared-dropdown class="filter-dropdown" [options]="categoryDropdownOptions()" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search categories" [selected]="[categoryId()]" (optionSelected)="selectCategory($event)"><button dropdown-trigger type="button"><span>{{ selectedLabel(categoryDropdownOptions(), categoryId(), 'All categories') }}</span><svg viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></svg></button></shared-dropdown></label>
      <label><span>Vehicle Type</span><shared-dropdown class="filter-dropdown" [options]="vehicleTypeDropdownOptions()" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search vehicle types" [selected]="[vehicleTypeId()]" (optionSelected)="selectVehicleType($event)"><button dropdown-trigger type="button"><span>{{ selectedLabel(vehicleTypeDropdownOptions(), vehicleTypeId(), 'All vehicle types') }}</span><svg viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></svg></button></shared-dropdown></label>
      <div class="filter-actions"><button type="button" class="reset-filter" (click)="resetFilters()">Reset</button><button type="button" class="apply-filter" (click)="applyFilters()">Apply filters</button></div>
    </div>
  </section>

  @if (error()) {
    <section class="vehicles-error" role="alert"><p>{{ error() }}</p><button type="button" (click)="loadVehicles()">Try again</button></section>
  }

  <shared-data-table
    class="smooth-reveal vehicles-table"
    title="Vehicle List"
    [subtitle]="'Showing ' + pageStart() + '–' + pageEnd() + ' of ' + total()"
    [columns]="columns"
    [rows]="vehicles()"
    [actions]="tableActions"
    [rowsClickable]="true"
    [showToolbar]="true"
    [showExport]="false"
    [showPrimaryAction]="false"
    [clientSideSearch]="false"
    searchPlaceholder="Search vehicles"
    (searchChange)="tableSearchChanged($event)"
    (rowAction)="handleRowAction($event)"
    (rowSelected)="openVehicle($event)"
  ></shared-data-table>

  <nav class="vehicle-pagination" aria-label="Vehicle pages">
    <span>Showing {{ pageStart() }}–{{ pageEnd() }} of {{ total() }}</span>
    <div><button type="button" [disabled]="offset() === 0" (click)="previousPage()">Previous</button><button type="button" [disabled]="offset() + limit >= total()" (click)="nextPage()">Next</button></div>
  </nav>

  <app-vehicle-form [open]="formOpen()" (cancelled)="formOpen.set(false)" (created)="addVehicle($event)" />
</section>
