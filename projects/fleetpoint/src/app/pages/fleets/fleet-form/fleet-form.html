<ui-blocking-loader
  [visible]="loading()"
  [compact]="true"
  [label]="editing() ? 'Updating fleet...' : 'Creating fleet...'"
/>
<app-modal [open]="open()" labelledBy="fleet-form-title" (closed)="cancel()">
  <h2 modal-header id="fleet-form-title">{{ editing() ? 'Update Fleet' : 'Create Fleet' }}</h2>
  <form id="fleet-form" class="fleet-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="shared-form-field"
      ><span>Name <b>*</b></span
      ><input
        class="shared-form-control"
        formControlName="name"
        placeholder="Enter fleet name"
        [attr.aria-invalid]="submitted() && form.controls.name.invalid"
      />
      @if (submitted() && form.controls.name.invalid) {
        <small class="shared-form-error">Enter a fleet name.</small>
      }
    </label>
    <label class="shared-form-field"
      ><span>Vehicles <b>*</b></span
      ><shared-dropdown
        class="fleet-vehicle-dropdown"
        [options]="vehicleOptions()"
        mode="multi"
        align="left"
        [searchable]="true"
        searchPlaceholder="Search vehicles"
        [showOptionIcons]="false"
        [matchTriggerWidth]="true"
        [selected]="form.controls.vehicle.value"
        (selectionChange)="selectVehicles($event)"
        ><button dropdown-trigger type="button" [disabled]="optionsLoading()">
          <span>{{ optionsLoading() ? 'Loading vehicles...' : vehiclesLabel() }}</span>
        </button></shared-dropdown
      >
      @if (submitted() && !form.controls.vehicle.value.length) {
        <small class="shared-form-error">Select at least one vehicle.</small>
      }
    </label>
  </form>
  <div modal-footer class="fleet-form-actions">
    <button type="button" class="shared-button-secondary" [disabled]="loading()" (click)="cancel()">
      Cancel</button
    ><button
      type="submit"
      form="fleet-form"
      class="shared-button-primary"
      [disabled]="form.invalid || !form.controls.vehicle.value.length || loading() || optionsLoading()"
    >
      {{ editing() ? 'Update Fleet' : 'Create Fleet' }}
    </button>
  </div>
</app-modal>
