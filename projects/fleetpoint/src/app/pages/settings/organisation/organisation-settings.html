<section class="settings-section"><header class="section-heading"><h2>Organisation</h2><p>Company profile, regional settings and billing information</p></header><article class="setting-card"><h3>Company Profile</h3><div class="logo-row"><span><img src="assets/fleetpoint/icons/building-muted.svg" alt="" aria-hidden="true"/></span><div><strong>Company Logo</strong><p>PNG or SVG · maximum 2MB · shown in reports and emails</p><button type="button">Upload logo</button></div></div><div class="field-grid"><label class="shared-form-field"><span>Company Name</span><input class="shared-form-control" value="LogisticsPro" (input)="store.mark()"/></label><label class="shared-form-field"><span>Industry</span><input class="shared-form-control" value="Logistics & Transport" (input)="store.mark()"/></label><label class="shared-form-field"><span>Country</span><input class="shared-form-control" value="United Kingdom" (input)="store.mark()"/></label><label class="shared-form-field"><span>Billing Email</span><input class="shared-form-control" type="email" value="billing@logisticspro.co.uk" (input)="store.mark()"/></label></div></article>
<article class="setting-card"><h3>Regional &amp; Units</h3><div class="field-grid"><label class="shared-form-field"><span>Distance Unit</span><div class="segmented"><button type="button" [class.active]="distance()==='miles'" (click)="set('distance','miles')">Miles</button><button type="button" [class.active]="distance()==='km'" (click)="set('distance','km')">Kilometres</button></div></label><label class="shared-form-field"><span>Speed Unit</span><div class="segmented"><button type="button" [class.active]="speed()==='mph'" (click)="set('speed','mph')">MPH</button><button type="button" [class.active]="speed()==='kph'" (click)="set('speed','kph')">KPH</button></div></label><label class="shared-form-field"><span>Timezone</span><shared-dropdown class="settings-dropdown" [options]="timezoneOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[timezone]" (optionSelected)="choose('timezone',$event)"><button dropdown-trigger type="button">{{timezone}}</button></shared-dropdown></label><label class="shared-form-field"><span>Currency</span><shared-dropdown class="settings-dropdown" [options]="currencyOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[currency]" (optionSelected)="choose('currency',$event)"><button dropdown-trigger type="button">{{currencyOptions[0].label}}</button></shared-dropdown></label><label class="shared-form-field"><span>Date Format</span><input class="shared-form-control" value="DD/MM/YYYY (UK)" readonly/></label><label class="shared-form-field"><span>Time Format</span><div class="segmented"><button type="button" [class.active]="time()==='24h'" (click)="set('time','24h')">24h</button><button type="button" [class.active]="time()==='12h'" (click)="set('time','12h')">12h</button></div></label></div></article>
<article class="setting-card"><header class="plan-heading"><h3>Plan &amp; Billing</h3><span>Professional</span></header><div class="plan-stats"><div><strong>8 / 15</strong><small>Seats Used</small></div><div><strong>15 / 50</strong><small>Vehicles</small></div><div><strong>01 Jan 2027</strong><small>Renewal</small></div></div><p class="usage-label"><span>Seats used</span><b>8 of 15</b></p><i class="usage"><b></b></i><button class="upgrade" type="button">Upgrade plan → add more seats or vehicles</button></article></section>
