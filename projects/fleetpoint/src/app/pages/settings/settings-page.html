<section class="settings-page"><aside><header><h1>Settings</h1>@if(store.changes()){<p>{{store.changes()}} unsaved {{store.changes()===1?'change':'changes'}}</p>}</header><nav>@for(item of sections;track item.path){<a [routerLink]="item.path" routerLinkActive="active"><span class="nav-icon">
  @switch(item.icon){@case('building'){<img src="assets/fleetpoint/icons/building.svg" alt="" aria-hidden="true"/>}@case('bell'){<img src="assets/fleetpoint/icons/bell.svg" alt="" aria-hidden="true"/>}@case('map'){<img src="assets/fleetpoint/icons/map.svg" alt="" aria-hidden="true"/>}@case('plug'){<img src="assets/fleetpoint/icons/plug.svg" alt="" aria-hidden="true"/>}@case('users'){<img src="assets/fleetpoint/icons/users-muted.svg" alt="" aria-hidden="true"/>}@default{<img src="assets/fleetpoint/icons/document-settings.svg" alt="" aria-hidden="true"/>}}
  </span><strong>{{item.label}}</strong>@if(item.tag){<small>{{item.tag}}</small>}</a>}</nav><footer><button type="button" [disabled]="!store.changes()" [class.saved]="store.saved()" (click)="save()"><img src="assets/fleetpoint/icons/save.svg" alt="" aria-hidden="true"/>{{store.saved()?'Saved':'Save Changes'}}</button></footer></aside><main><shared-smooth-height><router-outlet/></shared-smooth-height></main></section>
