<section class="settings-page"><aside><header><h1>Settings</h1>@if(store.changes()){<p>{{store.changes()}} unsaved {{store.changes()===1?'change':'changes'}}</p>}</header><nav>@for(item of sections;track item.path){<a [routerLink]="item.path" routerLinkActive="active"><span class="nav-icon">
  @switch(item.icon){@case('building'){<svg viewBox="0 0 24 24"><path d="M4 20V7l8-4 8 4v13M8 20v-5h8v5M8 9h1m6 0h1M8 12h1m6 0h1"/></svg>}@case('bell'){<svg viewBox="0 0 24 24"><path d="M6 16h12l-1.5-2.5V10a4.5 4.5 0 0 0-9 0v3.5L6 16Zm4 3h4"/></svg>}@case('map'){<svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15m6-12v15"/></svg>}@case('plug'){<svg viewBox="0 0 24 24"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0V8Zm6 9v4"/></svg>}@case('users'){<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.5-4 2.5-6 6-6s5.5 2 6 6m1-12a3 3 0 0 1 0 6m1 1c2.5.5 3.8 2.2 4 5"/></svg>}@default{<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M10 18h4"/></svg>}}
  </span><strong>{{item.label}}</strong>@if(item.tag){<small>{{item.tag}}</small>}</a>}</nav><footer><button type="button" [disabled]="!store.changes()" [class.saved]="store.saved()" (click)="save()"><svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5V4Zm3 0v6h8V4M8 20v-6h8v6"/></svg>{{store.saved()?'Saved':'Save Changes'}}</button></footer></aside><main><shared-smooth-height><router-outlet/></shared-smooth-height></main></section>
