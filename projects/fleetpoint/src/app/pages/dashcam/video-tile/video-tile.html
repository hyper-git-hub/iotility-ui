<article class="video-tile" [class.compact]="compact()">
  @if (!unavailable()) {
    <video [src]="src()" autoplay muted loop playsinline (error)="unavailable.set(true)"></video>
  } @else {
    <div class="video-empty">
      <img src="assets/fleetpoint/icons/video-camera.svg" alt="" aria-hidden="true" />
      <strong>{{ label() }}</strong
      ><small>Footage unavailable</small>
    </div>
  }
  <span class="camera-label">{{ label() }}</span
  ><span class="live"><i></i>Live</span>
</article>
