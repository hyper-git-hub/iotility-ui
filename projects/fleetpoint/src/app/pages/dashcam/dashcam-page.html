<section class="dashcam-page">
  <header class="dashcam-heading">
    <div>
      <h1>DashCam</h1>
      <p>
        {{ total }} events today · {{ critical }} critical · {{ unreviewed }} unreviewed · Powered
        by BSJ IOT
      </p>
    </div>
    <button type="button" class="export">
      <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v4h14v-4" /></svg>Export
    </button>
  </header>
  <section class="dashcam-stats">
    <app-stat-card label="Total Events" [value]="total" tone="brand" [compact]="true"
      ><svg stat-card-icon viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="14" rx="2" />
        <path d="m8 6 1.5-3h5L16 6" />
        <circle cx="12" cy="13" r="3" /></svg
    ></app-stat-card>
    <app-stat-card label="Critical" [value]="critical" tone="danger" [compact]="true"
      ><svg stat-card-icon viewBox="0 0 24 24">
        <path d="M12 3 2.5 20h19L12 3Z" />
        <path d="M12 9v5m0 3h.01" /></svg
    ></app-stat-card>
    <app-stat-card label="Unreviewed" [value]="unreviewed" tone="warning" [compact]="true"
      ><svg stat-card-icon viewBox="0 0 24 24">
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
        <circle cx="12" cy="12" r="2.5" /></svg
    ></app-stat-card>
    <app-stat-card label="Violations Raised" [value]="violations" tone="warning" [compact]="true"
      ><svg stat-card-icon viewBox="0 0 24 24"><path d="M6 21V4m0 1h11l-2 4 2 4H6" /></svg
    ></app-stat-card>
    <app-stat-card
      label="False Positive Rate"
      [value]="falsePositiveRate + '%'"
      tone="info"
      [compact]="true"
      ><svg stat-card-icon viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="m8 12 2.5 2.5L16 9" /></svg
    ></app-stat-card>
  </section>
  <nav class="dashcam-tabs">
    <a routerLink="live" routerLinkActive="active">Live View</a>
    <a routerLink="events" routerLinkActive="active"
      >Events <span>{{ total }}</span></a
    >
    <a routerLink="review" routerLinkActive="active"
      >Review Queue <span>{{ unreviewed }}</span></a
    >
    <a routerLink="analytics" routerLinkActive="active">Analytics</a>
  </nav>
  <router-outlet />
</section>
