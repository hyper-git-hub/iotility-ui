<app-modal [open]="open()" labelledBy="job-form-title" (closed)="cancel()">
  <h2 modal-header id="job-form-title">Create Job</h2>
  <form id="job-form" class="job-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="shared-form-field full"><span>Job Name <b>*</b></span><input class="shared-form-control" formControlName="name" placeholder="e.g. Amazon BHX2 Morning Delivery" [attr.aria-invalid]="invalid('name')"/>@if (invalid('name')) { <small class="shared-form-error">Enter a job name.</small> }</label>

    <label class="shared-form-field"><span>Job Type <b>*</b></span><shared-dropdown class="job-dropdown" [options]="typeOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.type.value]" (optionSelected)="select('type', $event)"><button dropdown-trigger type="button">{{ label(typeOptions, form.controls.type.value, 'Select job type...') }}</button></shared-dropdown></label>
    <label class="shared-form-field"><span>Priority <b>*</b></span><shared-dropdown class="job-dropdown" [options]="priorityOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="[form.controls.priority.value]" (optionSelected)="select('priority', $event)"><button dropdown-trigger type="button">{{ label(priorityOptions, form.controls.priority.value, 'Select priority...') }}</button></shared-dropdown></label>

    <label class="shared-form-field"><span>Assign Driver <b>*</b></span><shared-dropdown class="job-dropdown" [options]="driverOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search drivers" [selected]="[form.controls.driver.value]" (optionSelected)="select('driver', $event)"><button dropdown-trigger type="button">{{ label(driverOptions, form.controls.driver.value, 'Select driver...') }}</button></shared-dropdown>@if (invalid('driver')) { <small class="shared-form-error">Select a driver.</small> }</label>
    <label class="shared-form-field"><span>Vehicle (optional)</span><shared-dropdown class="job-dropdown" [options]="vehicleOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [searchable]="true" searchPlaceholder="Search vehicles" [selected]="[form.controls.vehicle.value]" (optionSelected)="select('vehicle', $event)"><button dropdown-trigger type="button">{{ label(vehicleOptions, form.controls.vehicle.value, 'Select vehicle...') }}</button></shared-dropdown></label>

    <label class="shared-form-field full"><span>Pickup Location <b>*</b></span><input class="shared-form-control" formControlName="pickup" placeholder="Address or select from POI..." [attr.aria-invalid]="invalid('pickup')"/>@if (invalid('pickup')) { <small class="shared-form-error">Enter a pickup location.</small> }</label>
    <label class="shared-form-field full"><span>Dropoff Location <b>*</b></span><input class="shared-form-control" formControlName="dropoff" placeholder="Address or select from POI..." [attr.aria-invalid]="invalid('dropoff')"/>@if (invalid('dropoff')) { <small class="shared-form-error">Enter a dropoff location.</small> }</label>

    <label class="shared-form-field"><span>Start Time <b>*</b></span><shared-date-time-picker mode="datetime" formControlName="startTime" placeholder="Select start date and time" ariaLabel="Choose job start date and time"/>@if (invalid('startTime')) { <small class="shared-form-error">Select a start date and time.</small> }</label>
    <label class="shared-form-field"><span>End Time <b>*</b></span><shared-date-time-picker mode="datetime" formControlName="endTime" [min]="form.controls.startTime.value" placeholder="Select end date and time" ariaLabel="Choose job end date and time"/>@if (invalid('endTime')) { <small class="shared-form-error">Select an end date and time.</small> } @else if (invalidRange()) { <small class="shared-form-error">End time must be after the start time.</small> }</label>

    <label class="shared-form-field full"><span>Notes</span><textarea class="shared-form-control" formControlName="notes" rows="3" placeholder="Any special instructions..."></textarea></label>
  </form>
  <div modal-footer class="job-form-actions"><button type="button" class="shared-button-secondary" (click)="cancel()">Cancel</button><button type="submit" form="job-form" class="shared-button-primary">Create Job</button></div>
</app-modal>
