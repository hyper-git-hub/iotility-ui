<app-modal [open]="open()" labelledBy="upload-document-title" (closed)="cancel()">
  <h2 modal-header id="upload-document-title">Upload Document</h2>
  <form id="upload-document-form" class="upload-document-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="shared-form-field"><span>Document Type <b>*</b></span><shared-dropdown class="form-dropdown" [options]="typeOptions" mode="single" align="left" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="form.controls.type.value?[form.controls.type.value]:[]" (optionSelected)="select('type',$event)"><button dropdown-trigger type="button">{{label(typeOptions,form.controls.type.value,'Select document type...')}}</button></shared-dropdown>@if(invalid('type')){<small class="shared-form-error">Select a document type.</small>}</label>
    <label class="shared-form-field"><span>Linked To <b>*</b></span><shared-dropdown class="form-dropdown" [options]="linkedOptions" mode="single" align="left" [searchable]="true" searchPlaceholder="Search vehicles, drivers or company" [showOptionIcons]="false" [matchTriggerWidth]="true" [selected]="form.controls.linkedTo.value?[form.controls.linkedTo.value]:[]" (optionSelected)="select('linkedTo',$event)"><button dropdown-trigger type="button">{{label(linkedOptions,form.controls.linkedTo.value,'Select vehicle, driver or company...')}}</button></shared-dropdown>@if(invalid('linkedTo')){<small class="shared-form-error">Choose a linked record.</small>}</label>
    <label class="upload-drop full"><input type="file" accept=".pdf,.jpg,.jpeg,.png" (change)="pickFile($event)"/><img src="assets/fleetpoint/icons/upload-brand.svg" alt="" aria-hidden="true"/><strong>{{fileName()||'Click to upload or drag and drop'}}</strong><small>PDF, JPG or PNG · maximum 10 MB</small></label>
    @if(submitted()&&!fileName()){<small class="shared-form-error full">Select a document to upload.</small>}
    <label class="shared-form-field"><span>Issue Date</span><shared-date-time-picker mode="date" formControlName="issueDate" placeholder="Select issue date" ariaLabel="Choose document issue date"/></label>
    <label class="shared-form-field"><span>Expiry Date</span><shared-date-time-picker mode="date" formControlName="expiryDate" placeholder="Select expiry date" ariaLabel="Choose document expiry date"/></label>
    <label class="shared-form-field full"><span>Issued By</span><input class="shared-form-control" formControlName="issuedBy" placeholder="e.g. DVLA, Aviva..."/></label>
    <label class="shared-form-field full"><span>Document Number</span><input class="shared-form-control" formControlName="documentNumber" placeholder="Licence number, policy number..."/></label>
  </form>
  <div modal-footer class="upload-document-actions"><button type="button" class="shared-button-secondary" (click)="cancel()">Cancel</button><button type="submit" form="upload-document-form" class="shared-button-primary">Upload Document</button></div>
</app-modal>
