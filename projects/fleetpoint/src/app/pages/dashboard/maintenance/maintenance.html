<section class="maintenance-page">
  @if (tableVisible()) {
    <shared-data-table
      class="maintenance-table"
      title="Vehicles Due for Service"
      [showToolbar]="false"
      [columns]="columns"
      [rows]="rows"
      emptyMessage="No record found."
    />
  }
  <div class="maintenance-charts">
    @for (graph of maintenanceGraphs(); track graph.code) {
      <app-dashboard-graph [graph]="graph" />
    }
  </div>
</section>
