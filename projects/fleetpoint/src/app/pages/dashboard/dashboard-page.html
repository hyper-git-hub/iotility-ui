<div class="dashboard-page">
  <header class="dashboard-heading smooth-reveal dashboard-reveal-heading">
    <div>
      <h1>Dashboard</h1>
      <p>
        <!-- LogisticsPro · B2B Logistics ·  -->
        {{ todayLabel }}</p>
    </div>
    <!-- <button type="button" class="customise-button">Customise Dashboard</button> -->
  </header>
  <nav class="dashboard-tabs smooth-reveal dashboard-reveal-tabs" aria-label="Dashboard sections">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: tab.exact }"
        >{{ tab.label }}</a
      >
    }
  </nav>
  <router-outlet />
</div>
