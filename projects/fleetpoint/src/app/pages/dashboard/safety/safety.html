<section class="safety-grid">
  @for (graph of safetyGraphs(); track graph.code) {
    <app-dashboard-graph
      [graph]="graph"
      [class.aggressive-fleets]="graph.code === 'ADF'"
      [class.driver-violations]="graph.code === 'DVG'"
      [class.safety-scorecard]="graph.code === 'DSS'"
    />
  }
</section>
