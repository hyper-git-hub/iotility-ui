<section class="analytics-grid">
  <app-fleet-bar-chart title="Visits Today — by Zone" subtitle="Daily zone traffic" [height]="320" [data]="visits" [options]="options"/>
  <app-fleet-bar-chart title="Violations — by Zone" subtitle="Triggered geozone events" [height]="320" [data]="violations" [options]="options"/>
</section>

<shared-data-table
  title="Zone Summary"
  [columns]="columns"
  [rows]="rows"
  [showToolbar]="false"
  [showExport]="false"
  [showPrimaryAction]="false"
  [minTableWidth]="1100"
>
  <ng-template tableCell="violationsLabel" let-row>
    @if (+row['violations'] === 0) {
      <span class="no-violations">
        <img src="assets/fleetpoint/icons/check.svg" alt="" aria-hidden="true" />
        None
      </span>
    } @else {
      <span class="violation-count">
        {{ row['violations'] }}
        <img src="assets/fleetpoint/icons/warning.svg" alt="" aria-hidden="true" />
      </span>
    }
  </ng-template>

  <ng-template tableCell="link" let-row>
    @if (row['link'] === 'POI') {
      <span class="zone-link poi-link">POI</span>
    } @else if (row['link'] === 'Route') {
      <span class="zone-link route-link">Route</span>
    } @else {
      <span class="no-link">—</span>
    }
  </ng-template>
</shared-data-table>
