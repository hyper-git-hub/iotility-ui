<shared-platform-header
  [showLive]="true"
  [userName]="identity.name"
  [userInitials]="identity.initials"
  (profileAction)="handleProfileAction($event)"
>
  <div header-brand class="fleetpoint-brand">
    <button
      type="button"
      class="mobile-menu-button"
      aria-label="Open navigation"
      (click)="menuToggle.emit()"
    >
<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <ui-logo
      src="assets/fleetpoint/fleetpoint.svg"
      alt="Fleetpoint"
      size="1.5rem"
      class="brand-mark"
    />
    <span class="brand-name">Fleet<span>point</span></span>
    <span class="brand-context">— LogisticsPro</span>
  </div>
</shared-platform-header>
