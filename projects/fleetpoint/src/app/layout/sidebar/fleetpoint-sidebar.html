<aside class="fleet-sidebar">
  <div class="brand">
    <span>FP</span>
    <div><strong>Fleetpoint</strong><small>LogisticsPro</small></div>
  </div>

  <nav aria-label="Primary navigation">
    @for (group of visibleMenu(); track group.title) {
      <section>
        <p>{{ group.title }}</p>
        @for (item of group.items; track item.route) {
          <a [routerLink]="routeFor(item.route)" routerLinkActive="active">
            <span class="nav-icon" [class.vehicle-nav-icon]="item.route === '/vehicles'">
              <img [src]="item.icon" alt="" aria-hidden="true" />
            </span>
            <span class="nav-label">{{ item.label }}</span>
            @if (item.route === '/live-tracking') {
              <span class="live-status-dot" title="Realtime tracking" aria-label="Realtime tracking"></span>
            }
            @if (item.badgeKey && badgeCounts[item.badgeKey]) {
              <em>{{ badgeCounts[item.badgeKey] }}</em>
            }
          </a>
        }
      </section>
    }
  </nav>

  <!-- <div class="sidebar-footer">
    <button type="button" (click)="confirmReturnToIotility()">‹ Back to IoTility</button>
  </div> -->
</aside>
