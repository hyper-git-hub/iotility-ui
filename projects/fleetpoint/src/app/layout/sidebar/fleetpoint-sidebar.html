<aside class="fleet-sidebar" [class.collapsed]="collapsed()">
  <div class="brand">
<ui-logo
      src="assets/fleetpoint/fleetpoint.svg"
      alt="Fleetpoint"
      size="2.25rem"
      class="brand-mark"
    />
    <div class="brand-text">
      <strong>Fleetpoint</strong>
      <small>LogisticsPro</small>
    </div>
    <button
      type="button"
      class="brand-toggle"
      (click)="toggleCollapsed()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!collapsed()"
      [tooltip]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [position]="collapsed() ? 'right' : 'bottom'"
    >
      @if (collapsed()) {
        <span class="color-icon size-4" style="--icon: url('/assets/fleetpoint/icons/chevron-right-brand.svg')" aria-hidden="true"></span>
      } @else {
        <span class="color-icon size-4" style="--icon: url('/assets/fleetpoint/icons/chevron-left-brand.svg')" aria-hidden="true"></span>
      }
    </button>
  </div>

  <nav aria-label="Primary navigation">
    @for (group of visibleMenu(); track group.title) {
      <section>
        <p>{{ group.title }}</p>
        @for (item of group.items; track item.route) {
          <a
            [routerLink]="routeFor(item.route)"
            routerLinkActive="active"
            [tooltip]="item.label"
            [position]="'right'"
            [disabled]="!collapsed()"
          >
            <span
              class="nav-icon color-icon"
              [class.vehicle-nav-icon]="item.route === '/vehicles'"
              [style.--icon]="'url(' + item.icon + ')'"
              aria-hidden="true"
            ></span>
            <span class="nav-label">{{ item.label }}</span>
            @if (item.route === '/live-tracking') {
              <span class="live-status-dot" title="Realtime tracking" aria-label="Realtime tracking"></span>
            }
            @if (item.badgeKey && badgeCounts[item.badgeKey]) {
              <em>{{ badgeCounts[item.badgeKey] }}</em>
            }
          </a>
        }
      </section>
    }
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="footer-return" (click)="confirmReturnToIotility()" [tooltip]="'Back to IoTility'" [position]="'right'" [disabled]="!collapsed()">
      <span class="footer-return-icon" aria-hidden="true">‹</span>
      <span class="footer-return-label">Back to IoTility</span>
    </button>
  </div>
</aside>
