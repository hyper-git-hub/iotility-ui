<article
  class="stat-card"
  [class.animated-border]="animatedBorder()"
  [class.compact]="compact()"
  [class.iconless]="!showIcon()"
  [attr.data-tone]="tone()"
  [style.--stat-card-accent]="accent() || null"
>
  @if (showIcon()) {
    <span class="stat-card-icon"><ng-content select="[stat-card-icon]" /></span>
  }
  @if (loading()) {
    <ui-skeleton
      class="stat-card-value-skeleton"
      variant="text"
      [width]="compact() ? '2.5rem' : '3.5rem'"
      height="1.5rem"
      radius="0.3rem"
    />
  } @else {
    <strong>{{ value() }}</strong>
  }
  <span>{{ label() }}</span>
</article>
