<article
  class="stat-card"
  sharedSpotlightBorder
  [class.compact]="compact()"
  [attr.data-tone]="tone()"
  [attr.data-zero]="isZero() || null"
  [style.--card-tone]="accent() || null"
>
  <header>
    <span class="stat-card-label">{{ label() }}</span>
    @if (showIcon()) {
      <i class="stat-card-icon">
        @if (icon()) {
          <span class="color-icon" [style.--icon]="'url(' + icon() + ')'" aria-hidden="true"></span>
        } @else {
          <ng-content select="[stat-card-icon]" />
        }
      </i>
    }
  </header>
  <div class="stat-card-body">
    @if (loading()) {
      <ui-skeleton
        class="stat-card-value-skeleton"
        variant="text"
        [width]="skeletonWidth() || (compact() ? '3rem' : '4rem')"
        [height]="compact() ? '1.25rem' : '1.5rem'"
        radius="0.3rem"
      />
    } @else {
      <!-- Counts from the previous value to the new one; flags data-trend so the card flashes the change. -->
      <strong class="stat-card-value" [uiCountUp]="value()"></strong>
    }
    @if (suffix()) {
      <small>{{ suffix() }}</small>
    }
  </div>
</article>
