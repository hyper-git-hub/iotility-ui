<div #map class="map-container" aria-label="Live vehicle map"></div>
@if (showOverlays()) {
  <div class="map-overlays" [class.details-panel-open]="detailsPanelOpen() && !isFullscreen()">
    <app-map-controls
      class="overlay-controls"
      [fullscreen]="isFullscreen()"
      (zoomIn)="zoomIn()"
      (zoomOut)="zoomOut()"
      (toggle3D)="onToggle3D()"
      (resetNorth)="onResetNorth()"
      [map]="mapRef()"
      [showFitAll]="true"
      (fitAll)="fitAllVehicles()"
      (geolocate)="onGeolocate()"
      (fullscreenToggle)="onFullscreenToggle()"
    />
  </div>
}
