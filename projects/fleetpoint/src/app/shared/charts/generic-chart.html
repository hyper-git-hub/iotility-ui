<article class="chart-card" [style.height.px]="height()">
  <header>
    <div>
      <h2>{{ title() }}</h2>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
    @if (statusLegend()) {
      <span class="status-legend">
        <span><i class="good" aria-hidden="true"></i>Good</span>
        <span><i class="ok" aria-hidden="true"></i>OK</span>
        <span><i class="low" aria-hidden="true"></i>Low</span>
      </span>
    }
    @if (legendItems().length) {
      <span class="status-legend">
        @for (item of legendItems(); track $index) {
          <span><i [style.background]="item.color" aria-hidden="true"></i>{{ item.label }}</span>
        }
      </span>
    }
    @if (badge()) {
      <span class="badge">{{ badge() }}</span>
    }
    @if (filterOptions().length) {
      <app-graph-filter
        [options]="filterOptions()"
        [ariaLabel]="filterAriaLabel()"
        [selectedId]="selectedFilterId()"
        (selected)="filterSelected.emit($event)"
      />
    }
  </header>
  <div class="chart-wrap"><canvas #canvas></canvas></div>
</article>
