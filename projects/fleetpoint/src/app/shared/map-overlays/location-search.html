<div class="location-search">
  <label class="search-field">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input
      type="text"
      placeholder="Search location..."
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (focus)="showResults.set(query().trim().length > 0)"
      (blur)="onBlur()"
    />
    @if (query()) {
      <button type="button" class="clear-btn" (click)="clear()" aria-label="Clear search">×</button>
    }
    @if (loading()) {
      <span class="spinner" aria-label="Searching"></span>
    }
  </label>

  @if (showResults() && results().length > 0) {
    <div class="results-list">
      @for (result of results(); track result.lat + result.lon) {
        <button type="button" class="result-row" (mousedown)="onSelect(result)">
          <svg class="result-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span class="result-text">{{ result.display_name }}</span>
        </button>
      }
    </div>
  }
</div>
