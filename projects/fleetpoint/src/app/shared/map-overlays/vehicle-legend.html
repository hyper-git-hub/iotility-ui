<div class="vehicle-legend" role="list" aria-label="Vehicle status legend">
  @for (status of statuses; track status.key) {
    <span class="legend-item" role="listitem">
      <i class="legend-dot" [style.background]="status.color" aria-hidden="true"></i>
      <span class="legend-label">{{ status.label }}</span>
    </span>
  }
</div>
