<div class="live-badge" [attr.aria-live]="isLive() ? 'polite' : 'off'" [class.loading]="loading()">
  <span class="live-dot" [class.inactive]="!isLive()" aria-hidden="true"></span>
  @if (loading()) {
    <span class="badge-skeleton">
      <ui-skeleton width="9.5rem" height="1rem" radius="0.25rem" />
    </span>
  } @else {
    <span class="badge-text">
      {{ isLive() ? 'Live' : 'Offline' }} · {{ currentTime() }} · {{ vehicleCount() }}
      {{ vehicleCount() === 1 ? 'vehicle' : 'vehicles' }}
    </span>
  }
</div>
