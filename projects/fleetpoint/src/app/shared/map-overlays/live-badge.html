<div class="live-badge" [attr.aria-live]="isLive() ? 'polite' : 'off'" [class.loading]="loading()" [class.offline]="isOffline()">
  <span class="live-dot" [class.inactive]="!isLive() || isOffline()" aria-hidden="true"></span>
  @if (loading()) {
    <span class="badge-skeleton">
      <span class="badge-skeleton-copy" aria-hidden="true">
        {{ isOffline() ? 'Offline' : 'Live' }} · 00:00:00
      </span>
      <ui-skeleton width="100%" height="0.75rem" radius="0.25rem" />
    </span>
  } @else {
    <span class="badge-text">
      {{ isOffline() ? 'Offline' : 'Live' }} · {{ currentTime() }}
      @if (!isOffline() && vehicleCount() > 0) {
        · {{ vehicleCount() }} {{ vehicleCount() === 1 ? 'vehicle' : 'vehicles' }}
      }
    </span>
  }
</div>
