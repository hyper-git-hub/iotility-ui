<div class="map-controls" role="group" aria-label="Map controls">
  <button type="button" class="map-btn" (click)="onZoomIn()" aria-label="Zoom in" tooltip="Zoom in" position="left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <line x1="11" y1="8" x2="11" y2="14"></line>
      <line x1="8" y1="11" x2="14" y2="11"></line>
    </svg>
  </button>
  <button type="button" class="map-btn" (click)="onZoomOut()" aria-label="Zoom out" tooltip="Zoom out" position="left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <line x1="8" y1="11" x2="14" y2="11"></line>
    </svg>
  </button>
  @if (!zoomOnly()) {
    <div class="map-btn-divider" aria-hidden="true"></div>
    <button type="button" class="map-btn" (click)="onToggle3D()" [class.active]="is3D()" aria-label="Toggle 3D view" tooltip="Toggle 3D view" position="left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
      <line x1="12" y1="22" x2="12" y2="15.5"></line>
      <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
    </svg>
  </button>
  <button type="button" class="map-btn" (click)="onResetNorth()" aria-label="Reset bearing to north" tooltip="Reset bearing" position="left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 2.5-6 17 6-3 6 3-6-17Z"></path>
    </svg>
  </button>
  <button type="button" class="map-btn" (click)="onRotate()" aria-label="Rotate map" tooltip="Rotate map" position="left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 2v6h-6"></path>
      <path d="M21 13a9 9 0 1 1-3-7.7L21 8"></path>
    </svg>
  </button>
<button type="button" class="map-btn" (click)="onFullscreen()" [class.active]="fullscreen()" aria-label="Toggle fullscreen" tooltip="Toggle fullscreen" position="left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @if (fullscreen()) {
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
        } @else {
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        }
      </svg>
    </button>
  }
</div>
