<div class="map-controls" role="group" aria-label="Map controls">
  <button type="button" class="map-btn" (click)="onZoomIn()" aria-label="Zoom in" title="Zoom in">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <line x1="11" y1="8" x2="11" y2="14"></line>
      <line x1="8" y1="11" x2="14" y2="11"></line>
    </svg>
  </button>
  <button type="button" class="map-btn" (click)="onZoomOut()" aria-label="Zoom out" title="Zoom out">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <line x1="8" y1="11" x2="14" y2="11"></line>
    </svg>
  </button>
  <div class="map-btn-divider" aria-hidden="true"></div>
  <button type="button" class="map-btn" (click)="onToggle3D()" [class.active]="is3D()" aria-label="Toggle 3D view" title="Toggle 3D view">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon>
      <line x1="12" y1="22" x2="12" y2="15.5"></line>
      <polyline points="22 8.5 12 15.5 2 8.5"></polyline>
    </svg>
  </button>
  <button type="button" class="map-btn" (click)="onResetNorth()" aria-label="Reset bearing to north" title="Reset bearing">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <polygon points="12 2 15.5 10 12 8 8.5 10" fill="currentColor" stroke="none"></polygon>
      <polygon points="12 22 8.5 14 12 16 15.5 14" fill="none"></polygon>
    </svg>
  </button>
  <button type="button" class="map-btn" (click)="onRotate()" aria-label="Rotate map" title="Rotate map">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
      <path d="M21 3v5h-5"></path>
    </svg>
  </button>
  <div class="map-btn-divider" aria-hidden="true"></div>
  <button type="button" class="map-btn" (click)="onGeolocate()" [class.active]="isLocating()" aria-label="Locate me" title="Locate me">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
    </svg>
  </button>
  <button type="button" class="map-btn" (click)="onFullscreen()" [class.active]="fullscreen()" aria-label="Toggle fullscreen" title="Toggle fullscreen">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (fullscreen()) {
        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
      } @else {
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      }
    </svg>
  </button>
</div>
