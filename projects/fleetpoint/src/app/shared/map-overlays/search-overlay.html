<div class="search-overlay">
  <label class="search-field">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input
      type="text"
      placeholder="Search plate, driver, location..."
      [value]="search()"
      (input)="onSearch($event)"
    />
    @if (search()) {
      <button type="button" class="clear-btn" (click)="clearSearch()" aria-label="Clear search">×</button>
    }
  </label>

  <div class="status-filters" role="group" aria-label="Filter by status">
    @for (filter of filters; track filter) {
      <button
        type="button"
        class="filter-chip"
        [class.active]="filterStatus() === filter"
        (click)="onFilter(filter)"
      >
        @if (filter === 'All') {
          <span>All ({{ totalVehicles() }})</span>
        } @else {
          <span class="chip-dot" [style.background]="statusColor(filter)" aria-hidden="true"></span>
          <span>{{ filter }}</span>
        }
      </button>
    }
  </div>

  @if (showResults()) {
    @if (hasResults()) {
      <div class="results-list">
        @for (vehicle of results(); track vehicle.id) {
          <button type="button" class="result-row" (click)="onSelect(vehicle)">
            <img class="result-image" [src]="vehicleImage(vehicle.image)" (error)="useDefaultVehicleImage($event)" alt="" />
            <span class="result-copy">
              <strong>{{ vehicle.id }}</strong>
              <small>{{ vehicle.driver }} · {{ vehicle.location }}</small>
            </span>
            <span class="result-status" [class]="'status-' + vehicle.status.toLowerCase()">{{ vehicle.status }}</span>
          </button>
        }
      </div>
    } @else {
      <p class="no-results">No vehicles found</p>
    }
  }
</div>
