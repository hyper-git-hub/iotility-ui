name: Build and deploy iotility microfrontend to Azure Web App

on:
  push:
    branches:
      - qpmc
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-dev-iotility-hn-us
  NODE_VERSION: '22.x'
  DEPLOYMENT_PATH: deployment

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build host and remote
        shell: bash
        run: |
          set -euo pipefail

          # Temporary workaround for Fleetpoint component styles
          # that currently exceed the 20 kB component-style limit.
          sed -i \
            's/"maximumError": "20kB"/"maximumError": "40kB"/g' \
            angular.json

          npm run build

      - name: Assemble microfrontend deployment
        shell: bash
        run: |
          set -euo pipefail

          HOST_OUTPUT="dist/iotility/browser"
          REMOTE_OUTPUT="dist/fleetpoint/browser"

          test -f "${HOST_OUTPUT}/index.html"
          test -f "${HOST_OUTPUT}/federation.manifest.json"
          test -f "${REMOTE_OUTPUT}/remoteEntry.json"

          rm -rf "${DEPLOYMENT_PATH}"
          mkdir -p "${DEPLOYMENT_PATH}/fleetpoint"

          cp -a "${HOST_OUTPUT}/." "${DEPLOYMENT_PATH}/"
          cp -a "${REMOTE_OUTPUT}/." "${DEPLOYMENT_PATH}/fleetpoint/"

          # Serve the Fleetpoint remote from the same Azure Web App.
          sed -i \
            's#http://localhost:4201/remoteEntry.json#/fleetpoint/remoteEntry.json#g' \
            "${DEPLOYMENT_PATH}/federation.manifest.json"

          grep -q \
            '"fleetpoint": "/fleetpoint/remoteEntry.json"' \
            "${DEPLOYMENT_PATH}/federation.manifest.json"

          test -f "${DEPLOYMENT_PATH}/index.html"
          test -f "${DEPLOYMENT_PATH}/fleetpoint/remoteEntry.json"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: iotility-webapp
          path: ${{ env.DEPLOYMENT_PATH }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: iotility-webapp
          path: ${{ env.DEPLOYMENT_PATH }}

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f "${DEPLOYMENT_PATH}/index.html"
          test -f "${DEPLOYMENT_PATH}/federation.manifest.json"
          test -f "${DEPLOYMENT_PATH}/fleetpoint/remoteEntry.json"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_939666067E274AC09EECBB60F6A0BF04 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CFEDA71E3BCE4EC0B4D08A1E875979D4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9148C1B0841A4EE29D58AC8EA3562462 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ${{ env.DEPLOYMENT_PATH }}
